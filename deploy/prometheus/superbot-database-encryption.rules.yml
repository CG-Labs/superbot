# Database encryption alerts for botd (docs/adr/0116-database-encrypted-at-rest.md), from the
# metrics in docs/adr/0089-metrics-and-structured-logs.md.
#
# Load it from prometheus.yml, next to the other rules:
#   rule_files: ["/etc/prometheus/superbot-backup-encryption.rules.yml", "/etc/prometheus/superbot-database-encryption.rules.yml"]
# Check it with: promtool check rules superbot-database-encryption.rules.yml
#                promtool test rules superbot-database-encryption.rules.test.yml
#
# It assumes the scrape job is named "superbot" (as in deploy/README.md), and alerts per
# instance. A server that keeps its database plain by choice (SUPERBOT_DATABASE_ENCRYPTION=off)
# doesn't alert; its gauge still shows 0.

groups:
  - name: superbot-database-encryption-alerts
    rules:
      # The database is plain, and plaintext wasn't chosen.
      - alert: SuperBotDatabaseUnencrypted
        expr: |
          max by (job, instance) (superbot_database_encrypted{job="superbot"}) == 0
          unless on (job, instance)
          max by (job, instance) (superbot_database_plaintext_allowed{job="superbot"}) == 1
        for: 1h
        labels:
          severity: ticket
        annotations:
          summary: "The database isn't encrypted"
          description: "botd's database on {{ $labels.instance }} is plain, so anyone who gets app.sqlite, a disk image or a copy of DATA_DIR can read every chat in it. Set SUPERBOT_DATABASE_ENCRYPTION=required and restart (deploy/install.sh --database-encryption required); botd encrypts it and keeps a plain copy until you delete it. Or set it to off to keep it plain by choice. botctl database shows the state. See docs/support/runbook-encryption.md#the-database-isnt-encrypted."
      # Encrypting left a plain copy beside the database for a day.
      - alert: SuperBotDatabasePlainCopyLeft
        expr: max by (job, instance) (superbot_database_plain_copies{job="superbot"}) > 0
        for: 24h
        labels:
          severity: ticket
        annotations:
          summary: "A plain copy of the database is still in DATA_DIR"
          description: "botd encrypted the database on {{ $labels.instance }} and kept a plain copy of it, which holds every chat unencrypted. Once SuperBot runs well, delete it (botctl database names it). See docs/support/runbook-encryption.md#a-plain-copy-is-left."

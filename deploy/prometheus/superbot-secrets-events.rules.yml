# Alerts for botd following the external secrets store's change events (VAULT_EVENTS,
# docs/adr/0306-following-vaults-change-events.md), from the metrics in
# docs/adr/0318-vault-change-events-handoff-and-state.md.
#
# Load it from prometheus.yml, next to the other rules:
#   rule_files: ["/etc/prometheus/superbot-secrets-events.rules.yml"]
# Check it with: promtool check rules superbot-secrets-events.rules.yml
#                promtool test rules superbot-secrets-events.rules.test.yml
#
# It assumes the scrape job is named "superbot" (as in deploy/README.md), and alerts per
# instance. botd shows these metrics only while it follows a store's change events, so a
# server without VAULT_EVENTS=1 never alerts.

groups:
  - name: superbot-secrets-events-alerts
    rules:
      # botd lost the stream and hasn't subscribed again for 10 minutes (it tries every
      # minute at most), so rotations wait for the cache again.
      - alert: SuperBotSecretsChangeEventsDown
        expr: max by (job, instance, backend) (superbot_secrets_change_events_following{job="superbot"}) == 0
        for: 10m
        labels:
          severity: ticket
        annotations:
          summary: "botd isn't following the secrets store's change events"
          description: "botd on {{ $labels.instance }} lost {{ $labels.backend }}'s change events and couldn't subscribe again for 10 minutes, so a rotated secret reaches new runs only within SECRETS_CACHE_SECONDS. Runs carry on. botctl secrets backend and the server log say why (a policy without subscribe, a proxy that doesn't pass WebSockets, Vault down). See docs/ops/vault.md#following-vaults-change-events."
      # The stream keeps dropping: each loss reads every cached secret again from the store.
      - alert: SuperBotSecretsChangeEventsFlapping
        expr: sum by (job, instance, backend) (increase(superbot_secrets_change_events_lost_total{job="superbot"}[1h])) >= 6
        for: 15m
        labels:
          severity: ticket
        annotations:
          summary: "botd keeps losing the secrets store's change events"
          description: "botd on {{ $labels.instance }} lost {{ $labels.backend }}'s change events {{ $value | humanize }} times in the last hour, and reads every cached secret again after each. A proxy or load balancer in front of Vault that closes long-lived connections is the usual cause; botctl secrets backend shows the last reason. See docs/ops/vault.md#following-vaults-change-events."

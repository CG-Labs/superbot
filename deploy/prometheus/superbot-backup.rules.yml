# Server backup alerts for botd (docs/adr/0109-server-backups-off-the-host.md), from the
# metrics in docs/adr/0089-metrics-and-structured-logs.md.
#
# Load it from prometheus.yml, next to the SLO rules:
#   rule_files: ["/etc/prometheus/superbot-slo.rules.yml", "/etc/prometheus/superbot-backup.rules.yml"]
# Check it with: promtool check rules superbot-backup.rules.yml
#                promtool test rules superbot-backup.rules.test.yml
#
# It assumes the scrape job is named "superbot" (as in deploy/README.md), and alerts per
# instance, so one server that copies never hides another that doesn't. botd pages its
# own notifier on an RPO breach too (server.backup_rpo_breached); these rules are for
# operators who alert from Prometheus. `botctl backups` shows what botd sees.

groups:
  - name: superbot-backup-alerts
    rules:
      # No store is set, or SERVER_BACKUP_OFF_HOST=off: losing the host loses the backups.
      - alert: SuperBotServerBackupsOnHost
        expr: max by (job, instance) (superbot_server_backup_off_host{job="superbot"}) == 0
        for: 1h
        labels:
          severity: ticket
        annotations:
          summary: Server backups stay on the host
          description: "botd isn't copying its backups off this host, so losing the host loses them. Set SERVER_BACKUP_S3_BUCKET with its endpoint and keys (deploy/install.sh --backup-s3-bucket, or .env) and restart botd. See docs/ops/backup-restore.md."

      # The newest archive off the host is older than SERVER_BACKUP_RPO_HOURS.
      - alert: SuperBotServerBackupPastRPO
        expr: max by (job, instance) (superbot_server_backup_past_rpo{job="superbot"}) == 1
        labels:
          severity: page
        annotations:
          summary: Server backups are past their RPO
          description: "The newest server backup copied off the host is older than its RPO. botctl backups shows the last copy and its error; if no newer archive is in BACKUP_DIR, check superbot-backup's timer (systemctl status superbot-backup.timer) or the Compose backup sidecar."

      # Copies keep failing: each is retried every 30 minutes.
      - alert: SuperBotServerBackupCopyFailing
        expr: sum by (job, instance) (increase(superbot_events_total{job="superbot",event="server.backup_copy_failed"}[2h])) >= 2
        labels:
          severity: ticket
        annotations:
          summary: Copying server backups off the host keeps failing
          description: "botd failed to copy a server backup to its store at least twice in two hours. The audit log (server.backup_copy_failed) and botctl backups have the error: usually the store's keys, bucket or network."

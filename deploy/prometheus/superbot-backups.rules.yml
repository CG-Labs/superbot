# Machine backup alerts for botd (docs/adr/0110-linode-machine-recovery-objectives.md),
# from the metrics in docs/adr/0089-metrics-and-structured-logs.md.
#
# Load it from prometheus.yml, next to the other rules:
#   rule_files: ["/etc/prometheus/superbot-slo.rules.yml", "/etc/prometheus/superbot-signin.rules.yml",
#                "/etc/prometheus/superbot-capacity.rules.yml", "/etc/prometheus/superbot-backups.rules.yml"]
# Check it with: promtool check rules superbot-backups.rules.yml
#                promtool test rules superbot-backups.rules.test.yml
#
# It assumes the scrape job is named "superbot" (as in deploy/README.md). These cover
# machines backed up by their provider (Linode Backups, MACHINE_BACKUPS=on): botd reads
# when each machine's last backup succeeded every reconcile interval and reports the
# oldest by tier, never per machine. botd also audits and emails each machine that goes
# past its RPO (machine.rpo_breached, naming it); these rules are the same check from
# outside botd. Labels: provider (linode) and tier.

groups:
  - name: superbot-backup-alerts
    rules:
      # A running machine's newest provider backup (or its creation, if it has none yet)
      # is older than the RPO: a restore now would lose more than the objectives allow.
      - alert: SuperBotMachineBackupsStale
        expr: |
          max by (job, instance, provider, tier) (superbot_machine_provider_backup_age_max_seconds{job="superbot"})
            > on (job, instance, provider, tier)
          max by (job, instance, provider, tier) (superbot_machine_provider_backup_rpo_seconds{job="superbot"})
        for: 15m
        labels:
          severity: ticket
        annotations:
          summary: "A {{ $labels.provider }} machine on {{ $labels.tier }} has no backup within its RPO"
          description: "The oldest newest {{ $labels.provider }} backup among running {{ $labels.tier }} machines is {{ $value | humanizeDuration }} old, past the RPO (MACHINE_BACKUPS_RPO_HOURS). machine.rpo_breached in the audit log names the machines. Check their backups in the provider's console: a failed or paused backup, backups turned off, or a machine too busy to snapshot."

      # Running machines whose provider backups are off: nothing to restore them from.
      # botd turns them on each reconcile when MACHINE_BACKUPS=on; this stays on when that
      # keeps failing (machine.backups_failed says why) or MACHINE_BACKUPS=off.
      - alert: SuperBotMachineBackupsOff
        expr: sum by (job, instance, provider, tier) (superbot_machines_provider_backups{job="superbot",backups="off"}) > 0
        for: 1h
        labels:
          severity: ticket
        annotations:
          summary: "{{ $labels.provider }} machines on {{ $labels.tier }} have backups off"
          description: "{{ $value }} running {{ $labels.tier }} machines have had {{ $labels.provider }} backups off for an hour, so they can't be restored. With MACHINE_BACKUPS=on, machine.backups_failed in the audit log says why botd couldn't turn them on; with MACHINE_BACKUPS=off, turn it on or record why these machines go without."

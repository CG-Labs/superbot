# SuperBot on Docker Compose: botd + Caddy (HTTPS) + daily SQLite backups.
# Quick start (from this folder):
#   ./init.sh                      # writes .env with a random AUTH_PASSWORD
#   docker compose up -d           # pulls the published images (ghcr.io/cg-labs/superbot)
# Build from this checkout instead: ./init.sh --from-source, or add -f docker-compose.build.yml.
# Docs: deploy/README.md ("Docker Compose (supported)").

name: superbot

x-superbot-image: &superbot-image
  # Published by .github/workflows/docker.yml for amd64 and arm64. SUPERBOT_VERSION: main (every
  # merge), a release such as 1.2.3, or sha-<commit>.
  image: ${SUPERBOT_IMAGE:-ghcr.io/cg-labs/superbot:${SUPERBOT_VERSION:-main}}
  restart: unless-stopped
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]

services:
  botd:
    <<: *superbot-image
    env_file: ${SUPERBOT_ENV_FILE:-.env}
    environment:
      # Fixed by the image layout; .env cannot override these.
      HOST: 0.0.0.0
      PORT: "3000"
      DATA_DIR: /data
      WORKSPACE_DIR: /workspace
      ALLOW_NO_AUTH: ""
      AUTH_PASSWORD: ${AUTH_PASSWORD:?Set AUTH_PASSWORD in deploy/docker/.env (run ./init.sh)}
      # Encrypts saved secrets. Lives in .env on the host, never in a volume, so backups don't carry it.
      SUPERBOT_MASTER_KEY: ${SUPERBOT_MASTER_KEY:?Set SUPERBOT_MASTER_KEY in deploy/docker/.env (run ./init.sh)}
      # Caddy forwards the browser's Host header; botd answers only to these names.
      ALLOWED_HOSTS: ${SUPERBOT_DOMAIN:-localhost},${ALLOWED_HOSTS:-}
      # botd is reachable only through Caddy, so the audit log takes the client IP from X-Forwarded-For.
      TRUST_FORWARDED_FOR: "1"
      # Screens' viewers listen on the compose network, where only Caddy reaches them (/screen/69xx/).
      # Each checks its own token. Screens run with ISOLATION=off (docs/computer.md).
      SCREEN_ADDR: 0.0.0.0
      # Where the backup sidecar writes archives, which botd copies off the host when
      # SERVER_BACKUP_S3_BUCKET is set in .env (docs/adr/0109-server-backups-off-the-host.md).
      BACKUP_DIR: /backups
      SUPERBOT_BACKUP_INTERVAL: ${SUPERBOT_BACKUP_INTERVAL:-86400}
    # Per-user accounts (ISOLATION=users; docs/adr/0058-harness-os-user-by-default.md): sudo, the
    # image's only setuid program, starts each run as its user's account, and the root helper
    # superbot-userctl makes the account and its folders, and removes a leaving teammate's
    # (docs/adr/0066-removing-teammate-accounts-on-one-server.md). Runs get none of these: they drop
    # every capability when sudo switches to the account.
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, FSETID, SETUID, SETGID, AUDIT_WRITE]
    # Docker's own seccomp profile, plus the user, PID and network namespaces (and chroot inside
    # them) that Chromium's sandbox needs (docs/adr/0107-chromium-sandbox-in-the-container.md).
    # Regenerate it with ./seccomp-chromium.sh. Hosts that can't give Chromium its sandbox set
    # SUPERBOT_CHROMIUM_SANDBOX=off in .env; botd's log says which it is.
    security_opt: ["seccomp=./seccomp-chromium.json"]
    volumes:
      - data:/data
      - workspace:/workspace
      - home:/home/superbot
      # Each user's account folders: home (harness logins), workspace, memory, Bots' state.
      - users:/srv/superbot/users
      # So `docker compose exec botd superbot-backup` archives outlive the container, and
      # botd can copy the sidecar's archives off the host.
      - backups:/backups
    # Not published: reachable only through Caddy on the compose network.
    expose: ["3000"]
    # Chromium on the Bots' screens needs more shared memory than Docker's 64 MB.
    shm_size: 1gb
    stop_grace_period: 30s

  caddy:
    # Stock Caddy plus the web client served at /app/ and the landing page (Dockerfile target caddy).
    image: ${SUPERBOT_CADDY_IMAGE:-ghcr.io/cg-labs/superbot-caddy:${SUPERBOT_VERSION:-main}}
    restart: unless-stopped
    depends_on:
      botd:
        condition: service_healthy
    environment:
      # A hostname gets automatic HTTPS (Let's Encrypt); ":80" serves plain HTTP for localhost.
      SUPERBOT_SITE: ${SUPERBOT_DOMAIN:-:80}
    ports:
      - "${SUPERBOT_BIND:-127.0.0.1}:${SUPERBOT_HTTP_PORT:-80}:80"
      - "${SUPERBOT_BIND:-127.0.0.1}:${SUPERBOT_HTTPS_PORT:-443}:443"
      - "${SUPERBOT_BIND:-127.0.0.1}:${SUPERBOT_HTTPS_PORT:-443}:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]

  backup:
    <<: *superbot-image
    command: ["superbot-backup", "--loop"]
    depends_on:
      botd:
        condition: service_healthy
    environment:
      SUPERBOT_BACKUP_INTERVAL: ${SUPERBOT_BACKUP_INTERVAL:-86400}
      SUPERBOT_BACKUP_RETENTION_DAYS: ${SUPERBOT_BACKUP_RETENTION_DAYS:-14}
      SUPERBOT_BACKUP_AGE_RECIPIENTS: ${SUPERBOT_BACKUP_AGE_RECIPIENTS:-}
    volumes:
      - data:/data
      - backups:/backups
    network_mode: none
    # Not the image's check, which calls botd: this service has no network. A disabled check
    # makes some Compose versions fail `up --wait`.
    healthcheck:
      test: ["CMD", "test", "-d", "/backups"]
      interval: 10s

volumes:
  data:
  workspace:
  home:
  users:
  backups:
  caddy-data:
  caddy-config:

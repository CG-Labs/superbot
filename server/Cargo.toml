[package]
name = "botd"
version = "0.1.0"
edition = "2024"
publish = false

[[bin]]
name = "botd"
path = "src/main.rs"

[[bin]]
name = "botctl"
path = "src/bin/botctl.rs"

[[bin]]
name = "superbot-machine"
path = "src/bin/superbot-machine.rs"

[dependencies]
aws-lc-rs = "1"
axum = "0.8.9"
base64 = "0.22.1"
chacha20poly1305 = "0.10.1"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1.21", features = ["server", "http1", "tokio", "service"] }
rcgen = { version = "0.14", default-features = false, features = ["aws_lc_rs", "pem", "x509-parser"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "form"] }
rusqlite = { version = "0.43.0", features = ["bundled"] }
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std", "tls12"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
time = { version = "0.3", default-features = false, features = ["std"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "fs", "net", "process", "io-util", "sync", "time", "signal"] }
futures-util = { version = "0.3", default-features = false, features = ["alloc"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["aws_lc_rs", "tls12"] }
tokio-stream = { version = "0.1.19", features = ["sync"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6.8", features = ["cors"] }
url = "2"
x509-parser = { version = "0.18", default-features = false }
zeroize = "1.9.2"

[dev-dependencies]
tokio = { version = "1.54.1", features = ["test-util"] }

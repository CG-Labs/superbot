[package]
name = "botd"
version = "0.1.0"
edition = "2024"
publish = false

[[bin]]
name = "botd"
path = "src/main.rs"

[[bin]]
name = "botctl"
path = "src/bin/botctl.rs"

[dependencies]
aws-lc-rs = "1"
axum = "0.8.9"
base64 = "0.22.1"
chacha20poly1305 = "0.10.1"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "form"] }
rusqlite = { version = "0.43.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "process", "io-util", "sync", "time", "signal"] }
tokio-stream = { version = "0.1.19", features = ["sync"] }
tower-http = { version = "0.6.8", features = ["cors"] }
url = "2"
zeroize = "1.9.2"

[dev-dependencies]
tokio = { version = "1.54.1", features = ["test-util"] }

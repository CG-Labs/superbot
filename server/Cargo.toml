[package]
name = "botd"
version = "0.1.0"
edition = "2024"
publish = false

[[bin]]
name = "botd"
path = "src/main.rs"

[[bin]]
name = "botctl"
path = "src/bin/botctl.rs"

[[bin]]
name = "superbot-machine"
path = "src/bin/superbot-machine.rs"

[[bin]]
name = "superbot-license"
path = "src/bin/superbot-license.rs"

[[bin]]
name = "superbot-run"
path = "src/bin/superbot-run.rs"

[[bin]]
name = "superbot-site"
path = "src/bin/superbot-site/main.rs"

[dependencies]
age = { version = "0.12", default-features = false }
aws-lc-rs = "1"
axum = "0.8.9"
base64 = "0.22.1"
chacha20poly1305 = "0.10.1"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1.21", features = ["server", "http1", "tokio", "service"] }
libc = "0.2"
rcgen = { version = "0.14", default-features = false, features = ["aws_lc_rs", "pem", "x509-parser"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "form", "stream"] }
rusqlite = { version = "0.43.0", features = ["bundled-sqlcipher-vendored-openssl", "backup"] }
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std", "tls12"] }
rustls-platform-verifier = "0.7"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
time = { version = "0.3", default-features = false, features = ["std"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "fs", "net", "process", "io-util", "sync", "time", "signal"] }
futures-util = { version = "0.3", default-features = false, features = ["alloc"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["aws_lc_rs", "tls12"] }
tokio-stream = { version = "0.1.19", features = ["sync"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6.8", features = ["catch-panic", "cors"] }
url = "2"
webpki = { package = "rustls-webpki", version = "0.103", default-features = false, features = ["aws-lc-rs", "std"] }
x509-parser = { version = "0.18", default-features = false }
zeroize = "1.9.2"
roxmltree = "0.21"
miniz_oxide = "0.8"
qrcode = { version = "0.15", default-features = false, features = ["svg"] }
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }

[dev-dependencies]
tokio = { version = "1.54.1", features = ["test-util"] }

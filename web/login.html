    /* The sign-in frame of the app (docs/adr/0336-sign-in-on-the-design-system.md), on the same tokens (docs/adr/0341-console-sign-in-and-setup-on-the-design-system.md). */
    * { box-sizing: border-box; }
    html, body { margin: 0; }
    body {
      min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; padding: var(--space-xl);
      background: var(--c-bg); color: var(--c-text);
      font: var(--fs-md)/var(--lh-md) var(--font-sans);
      -webkit-font-smoothing: antialiased;
    }
    [hidden] { display: none !important; }
    .card {
      width: 100%; max-width: 440px; display: flex; flex-direction: column; gap: var(--space-lg);
      padding: var(--space-xxl); border-radius: var(--radius-xl);
      background: var(--c-raised); border: 1px solid var(--c-border); box-shadow: var(--shadow-card);
    }
    .head { display: flex; flex-direction: column; align-items: center; gap: var(--space-sm); margin-bottom: var(--space-sm); }
    .mark { width: 56px; height: 56px; border-radius: var(--radius-lg); margin-bottom: var(--space-sm); }
    h1 { margin: 0; font-size: var(--fs-xxl); line-height: var(--lh-xxl); font-weight: 600; letter-spacing: -0.01em; text-align: center; }
    p, .hint { margin: 0; color: var(--c-text-muted); font-size: var(--fs-md); line-height: var(--lh-md); text-align: center; }
    label.hint { font-size: var(--fs-sm); line-height: var(--lh-sm); font-weight: 500; text-align: left; }
    .field { display: flex; flex-direction: column; gap: 6px; }
    input {
      width: 100%; padding: var(--space-md) 14px; border-radius: var(--radius-md); border: 1px solid var(--c-border);
      background: var(--c-bg); color: var(--c-text); font: inherit; outline: none;
      transition: border-color var(--motion-fast) ease, box-shadow var(--motion-fast) ease;
    }
    input::placeholder { color: var(--c-text-faint); }
    input:hover { border-color: var(--c-border-strong); }
    input:focus { border-color: var(--c-accent); box-shadow: 0 0 0 3px var(--c-accent-soft); }
    button, #sso a {
      min-height: 48px; display: flex; align-items: center; justify-content: center; padding: 0 var(--space-xl);
      border-radius: var(--radius-pill); font: inherit; font-weight: 600; text-align: center; text-decoration: none; cursor: pointer;
      transition: background var(--motion-fast) ease, border-color var(--motion-fast) ease, opacity var(--motion-fast) ease;
    }
    button:focus-visible, #sso a:focus-visible, a.link:focus-visible { outline: 2px solid var(--c-accent); outline-offset: 2px; }
    #go { border: 0; background: var(--c-accent); color: var(--c-on-accent); }
    #go:hover { filter: brightness(1.08); }
    button:disabled, #go:disabled { opacity: .55; cursor: default; filter: none; }
    #sso { display: flex; flex-direction: column; gap: 10px; }
    #sso:empty { display: none; }
    #sso a { border: 1px solid var(--c-border-strong); background: var(--c-raised); color: var(--c-text); }
    #sso a:hover { background: var(--c-hover); }
    /* Apple allows its button only in black or white (docs/adr/0336-sign-in-on-the-design-system.md). */
    #sso a[data-type="apple"] { background: #000; border-color: #000; color: #fff; }
    .or { display: none; align-items: center; gap: var(--space-md); color: var(--c-text-faint); font-size: var(--fs-sm); line-height: var(--lh-sm); }
    .or::before, .or::after { content: ""; flex: 1; border-top: 1px solid var(--c-border-strong); }
    .notice {
      margin: 0; padding: var(--space-md) 14px; border-radius: var(--radius-md); border: 1px solid var(--c-danger);
      background: var(--c-danger-soft); color: var(--c-danger); font-size: var(--fs-sm); line-height: var(--lh-sm); text-align: left;
    }
    .notice:empty { display: none; }
    #mfa, #saved, #setup { display: flex; flex-direction: column; gap: var(--space-md); }
    /* Authenticator apps need dark modules on light to scan, in both schemes. */
    #qr { width: 200px; height: 200px; align-self: center; border-radius: var(--radius-md); background: #fff; padding: var(--space-sm); }
    .mono {
      font-family: var(--font-mono); font-size: var(--fs-sm); line-height: var(--lh-sm); word-break: break-all; user-select: all;
      color: var(--c-text); background: var(--c-code-bg); border: 1px solid var(--c-border); border-radius: var(--radius-md);
    }
    #key { padding: var(--space-md); text-align: center; }
    #codes { margin: 0; padding: var(--space-md) var(--space-lg); list-style: none; columns: 2; text-align: center; }
    a.link, button.link {
      min-height: 0; align-self: center; padding: var(--space-xs) var(--space-md); border: 0; border-radius: var(--radius-pill);
      background: none; color: var(--c-accent-text); font-size: var(--fs-sm); font-weight: 500; cursor: pointer;
    }
    a.link:hover, button.link:hover { background: var(--c-hover); }
    @media (prefers-color-scheme: dark) {
      #sso a[data-type="apple"] { background: #fff; border-color: #fff; color: #000; }
    }
    /* A phone's whole screen is the card. */
    @media (max-width: 520px) {
      body { padding: var(--space-lg); place-items: start center; }
      .card { padding: var(--space-sm); border: 0; border-radius: 0; background: none; box-shadow: none; }
    }
    @media (prefers-reduced-motion: reduce) {
      * { transition: none !important; }
    }
  </style>
</head>
<body>
  <form id="form" class="card" autocomplete="on">
    <div class="head">
      <img class="mark" alt="" src="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%2264%22%20height%3D%2264%22%20viewBox%3D%220%200%2064%2064%22%3E%3Crect%20width%3D%2264%22%20height%3D%2264%22%20rx%3D%2214.08%22%20fill%3D%22%23171717%22%2F%3E%3Csvg%20x%3D%223%22%20y%3D%223%22%20width%3D%2258%22%20height%3D%2258%22%20viewBox%3D%220%200%20100%20100%22%3E%0A%20%20%3Cpath%20fill%3D%22%234b8df8%22%20d%3D%22M50%208%20L52.8%2015.2%20L60%2018%20L52.8%2020.8%20L50%2028%20L47.2%2020.8%20L40%2018%20L47.2%2015.2%20Z%22%2F%3E%0A%20%20%3Crect%20x%3D%2247%22%20y%3D%2224%22%20width%3D%226%22%20height%3D%2210%22%20fill%3D%22%234b8df8%22%2F%3E%0A%20%20%3Crect%20x%3D%2214%22%20y%3D%2232%22%20width%3D%2272%22%20height%3D%2260%22%20rx%3D%2218%22%20fill%3D%22%232f72e4%22%2F%3E%0A%20%20%3Crect%20x%3D%2224%22%20y%3D%2245%22%20width%3D%2252%22%20height%3D%2232%22%20rx%3D%2216%22%20fill%3D%22%23171717%22%2F%3E%0A%20%20%3Crect%20x%3D%2236%22%20y%3D%2253%22%20width%3D%228%22%20height%3D%2216%22%20rx%3D%224%22%20fill%3D%22%23ececec%22%2F%3E%0A%20%20%3Crect%20x%3D%2256%22%20y%3D%2253%22%20width%3D%228%22%20height%3D%2216%22%20rx%3D%224%22%20fill%3D%22%23ececec%22%2F%3E%0A%3C%2Fsvg%3E%3C%2Fsvg%3E" /><!-- brand:mark -->
      <h1 id="title">Welcome to SuperBot</h1>
      <p id="mfa-say" hidden></p>
    </div>
    <div id="sso"></div>
    <div class="or" id="or">or</div>
    <div class="field" id="first">
      <label class="hint" for="secret">Enter your sign-in code, or the server password.</label>
      <input id="secret" type="password" autocomplete="current-password" placeholder="Sign-in code or password" autofocus required />
    </div>
    <!-- Two-factor authentication (docs/adr/0094-totp-second-factor.md). -->
    <div id="mfa" hidden>
      <img id="qr" alt="QR code to add SuperBot to an authenticator app" hidden />
      <div id="setup" hidden>
        <p>Or enter this key in the app:</p>
        <div class="mono" id="key"></div>
        <a class="link" id="otpauth">Open in an authenticator app on this device</a>
      </div>
      <input id="totp" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="6-digit code" aria-label="6-digit code" />
      <input id="recovery" autocomplete="off" placeholder="Recovery code" aria-label="Recovery code" hidden />
      <button class="link" id="use-recovery" type="button">Use a recovery code</button>
    </div>
    <div id="saved" hidden>
      <p>Save these recovery codes somewhere safe. Each works once if you lose your authenticator app. They won't be shown again.</p>
      <ul class="mono" id="codes"></ul>
    </div>
    <div class="notice" id="error" role="alert"></div>
    <button id="go" type="submit">Sign in</button>
  </form>
  <script>
    const form = document.getElementById("form");
    const secret = document.getElementById("secret");
    const go = document.getElementById("go");
    const error = document.getElementById("error");

    // Admins land on the console, everyone else on the app (docs/adr/0027-expo-primary-hermes-default.md).
    const landing = (me) => (me?.landing === "/console/" ? "/console/" : "/app/");
    // Set by the web app on a sign-out the server may not have seen (apps/client/src/auth.ts).
    const SIGNED_OUT = "superbot.signedOut";
    const signedOut = () => { try { return localStorage.getItem(SIGNED_OUT) === "1"; } catch { return false; } };
    if (!signedOut()) fetch("/api/auth/me").then(async (r) => { if (r.ok) location.replace(landing(await r.json())); }).catch(() => {});

    // Single sign-on: one button per provider the server offers.
    const SSO_ERRORS = {
      sso_not_linked: "Your account isn't set up on this server yet. Ask an admin to add you.",
      sso_not_allowed: "Your SuperBot account is disabled.",
      sso_wrong_account: "That account can't sign in here. Use your organization's account, with a verified email.",
      sso_email_taken: "A user with your email already exists. Ask an admin to link your sign-in to it.",
      sso_no_seat: "This server has no seats left for new people. Ask an admin to free one or add seats.",
      sso_cancelled: "Sign-in was cancelled.",
      sso_mfa_required: "Your organization's sign-in didn't use the method this server requires, such as multi-factor authentication. Sign in again with it, or ask an admin.",
      sso_assurance_required: "Your organization hasn't vouched for your identity at the level this server requires. Ask your organization's IT help desk, or an admin.",
      sso_reauth_required: "Your organization's sign-in was too long ago for this server, and it didn't sign you in again. Sign in again at your organization, or ask an admin.",
      sso_expired: "That sign-in expired. Try again.",
      sso_too_many: "Too many failed sign-ins. Try again later.",
      sso_unavailable: "That sign-in option isn't available.",
      sso_failed: "Single sign-on failed. Try again, or ask an admin to check the audit log.",
    };
    const code = new URLSearchParams(location.search).get("error");
    if (code) error.textContent = SSO_ERRORS[code] || SSO_ERRORS.sso_failed;
    fetch("/api/auth/sso").then((r) => (r.ok ? r.json() : { providers: [] })).then(({ providers }) => {
      const box = document.getElementById("sso");
      const seen = new Set();
      for (const p of Array.isArray(providers) ? providers : []) {
        if (typeof p?.id !== "string" || !/^[a-z0-9]{1,32}$/.test(p.id) || seen.has(p.id)) continue;
        seen.add(p.id);
        const a = document.createElement("a");
        a.dataset.type = p.type || "oidc";
        a.href = `/api/auth/sso/${encodeURIComponent(p.id)}/start?label=Web`;
        // Apple's guidelines want exactly this text, whatever the label.
        a.textContent = p.type === "apple" ? "Sign in with Apple" : `Sign in with ${p.label || p.id}`;
        box.appendChild(a);
      }
      if (box.children.length) document.getElementById("or").style.display = "flex";
    }).catch(() => {});

    const $ = (id) => document.getElementById(id);
    const totp = $("totp"), recovery = $("recovery");
    // The second step of a sign-in: the server's challenge, and whether it is setting up an app.
    let challenge = null, enrolling = false, done = null;

    $("use-recovery").addEventListener("click", () => {
      const on = recovery.hidden;
      recovery.hidden = !on;
      totp.hidden = on;
      $("use-recovery").textContent = on ? "Use the code from your app" : "Use a recovery code";
      (on ? recovery : totp).focus();
    });

    function askSecondFactor(data) {
      challenge = data.challenge;
      enrolling = data.mfa === "enroll";
      $("first").hidden = secret.hidden = true;
      secret.required = false;
      $("title").textContent = enrolling ? "Set up two-factor authentication" : "Two-factor authentication";
      $("mfa").hidden = $("mfa-say").hidden = false;
      $("mfa-say").textContent = data.error;
      $("use-recovery").hidden = enrolling;
      if (enrolling && data.secret) {
        $("qr").src = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(data.qrSvg || "");
        $("qr").hidden = !data.qrSvg;
        $("setup").hidden = false;
        $("key").textContent = data.secret.replace(/(.{4})/g, "$1 ").trim();
        $("otpauth").href = data.otpauthUrl;
      }
      go.textContent = enrolling ? "Turn on and sign in" : "Verify";
      totp.value = recovery.value = "";
      (recovery.hidden ? totp : recovery).focus();
    }

    async function signedIn() {
      try { localStorage.removeItem(SIGNED_OUT); } catch {}
      // Browsers drop Secure cookies on plain http, except on localhost.
      const me = await fetch("/api/auth/me");
      if (me.ok) return location.replace(landing(await me.json().catch(() => null)));
      error.textContent = "Signed in, but this browser didn't keep the session. Open SuperBot over HTTPS.";
    }

    function showRecoveryCodes(codes) {
      $("mfa").hidden = $("mfa-say").hidden = true;
      $("saved").hidden = false;
      $("title").textContent = "Two-factor authentication is on";
      $("codes").replaceChildren(...codes.map((c) => Object.assign(document.createElement("li"), { textContent: c })));
      go.textContent = "I saved them. Continue";
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      if (done) return done();
      const body = { session: "cookie", label: "Web" };
      if (challenge) {
        body.challenge = challenge;
        if (recovery.hidden) body.totp = totp.value.replace(/\s/g, ""); else body.recoveryCode = recovery.value.trim();
        if (!body.totp && !body.recoveryCode) return;
      } else {
        const value = secret.value.trim();
        if (value.startsWith("sbc_")) body.code = value; else body.password = value;
      }
      go.disabled = true;
      error.textContent = "";
      try {
        const r = await fetch("/api/auth/login", {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify(body),
        });
        const data = await r.json().catch(() => ({}));
        if (r.ok) {
          if (Array.isArray(data.recoveryCodes) && data.recoveryCodes.length) {
            done = signedIn;
            return showRecoveryCodes(data.recoveryCodes);
          }
          return signedIn();
        }
        if (r.status === 401 && data.challenge && data.mfa) {
          if (data.challenge !== challenge) askSecondFactor(data);
          else error.textContent = data.error;
          totp.value = recovery.value = "";
          return;
        }
        // A spent or expired challenge: start again.
        if (challenge) setTimeout(() => location.reload(), 2500);
        error.textContent = data.error || "Sign-in failed. Check your code or password, then try again.";
      } catch {
        error.textContent = "Can't reach the SuperBot server. Check your connection, then try again.";
      } finally {
        go.disabled = false;
      }
    });
  </script>
</body>
</html>

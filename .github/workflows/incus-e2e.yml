name: incus-e2e

# Per-user containers (ADR 0065, 0067) on a real Incus host, not the stand-in: the
# runner becomes the Incus host and botd's tests make, enroll, isolate, suspend,
# resume, resize, rebuild and destroy real containers (ADR 0069), and back one up to
# an S3-compatible store on loopback and restore it (ADR 0071). Runs when the machines code changes,
# weekly, and by hand.

on:
  pull_request:
    paths:
      - 'server/src/machines/**'
      - 'server/src/machines_incus_e2e_tests.rs'
      - 'server/src/machines_backup_tests.rs'
      - 'server/src/bin/superbot-machine.rs'
      - 'deploy/incus-e2e-host.sh'
      - 'Cargo.lock'
      - '.github/workflows/incus-e2e.yml'
  push:
    branches: [main]
    paths:
      - 'server/src/machines/**'
      - 'server/src/machines_incus_e2e_tests.rs'
      - 'server/src/machines_backup_tests.rs'
      - 'server/src/bin/superbot-machine.rs'
      - 'deploy/incus-e2e-host.sh'
      - 'Cargo.lock'
      - '.github/workflows/incus-e2e.yml'
  schedule:
    - cron: '41 5 * * 2'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: incus-e2e-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  containers:
    name: Containers on Incus (${{ matrix.incus }})
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # zabbly: the current stable release. zabbly-lts-7.0: the LTS botd supports.
        # zabbly-lts-6.0 and ubuntu (24.04's own 6.0.0) are too old (ADR 0069), so the
        # test checks that botd's preflight check says so.
        include:
          - incus: zabbly
          - incus: zabbly-lts-7.0
          - incus: zabbly-lts-6.0
            expect: too-old
          - incus: ubuntu
            expect: too-old
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build the agent and botd's tests
        run: |
          set -euo pipefail
          cargo build --bin superbot-machine
          cargo test --no-run --message-format=json >/tmp/build.json
          jq -r 'select(.reason == "compiler-artifact" and .target.name == "botd" and .target.kind == ["bin"] and .profile.test) | .executable' \
            /tmp/build.json >/tmp/test-bin
          test -x "$(cat /tmp/test-bin)"
      - name: Make the runner an Incus host
        run: sudo SUPERBOT_INCUS_E2E_THROWAWAY=1 INCUS_SOURCE=${{ matrix.incus }} deploy/incus-e2e-host.sh "$RUNNER_TEMP/incus-e2e"
      # MinIO's images are no longer public, so the store is versitygw, run from its
      # pinned release package (checked against its SHA-256) rather than a registry.
      - name: An S3-compatible store on loopback (versitygw), for backups
        if: matrix.expect != 'too-old'
        env:
          VGW_DEB: versitygw_1.11.0_linux_amd64.deb
          VGW_SHA256: 93210fa3fb055ef27a9d5910cba97d6eb8b5a409bbe59fb824ecc4a55242e9d3
        run: |
          set -euo pipefail
          key="e2e$(openssl rand -hex 8)"; secret="$(openssl rand -hex 24)"
          echo "::add-mask::$secret"
          curl -fsSL --retry 5 -o "$RUNNER_TEMP/$VGW_DEB" "https://github.com/versity/versitygw/releases/download/v1.11.0/$VGW_DEB"
          echo "$VGW_SHA256  $RUNNER_TEMP/$VGW_DEB" | sha256sum -c -
          dpkg-deb -x "$RUNNER_TEMP/$VGW_DEB" "$RUNNER_TEMP/vgw"
          mkdir -p "$RUNNER_TEMP/s3"
          ROOT_ACCESS_KEY="$key" ROOT_SECRET_KEY="$secret" nohup "$RUNNER_TEMP/vgw/usr/bin/versitygw" \
            --port 127.0.0.1:9000 posix "$RUNNER_TEMP/s3" >"$RUNNER_TEMP/s3.log" 2>&1 &
          for _ in $(seq 1 30); do
            [ "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:9000/)" != 000 ] && break
            sleep 1
          done
          [ "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:9000/)" != 000 ]
          {
            echo "SUPERBOT_INCUS_E2E_S3_ENDPOINT=http://127.0.0.1:9000"
            echo "SUPERBOT_INCUS_E2E_S3_BUCKET=superbot-e2e"
            echo "MACHINE_BACKUP_S3_ACCESS_KEY_ID=$key"
            echo "MACHINE_BACKUP_S3_SECRET_ACCESS_KEY=$secret"
          } >>"$GITHUB_ENV"
      - name: Containers enroll, stay apart, follow the lifecycle, and are backed up and restored
        env:
          SUPERBOT_INCUS_E2E_EXPECT: ${{ matrix.expect }}
        run: |
          set -euo pipefail
          set -a; . "$RUNNER_TEMP/incus-e2e/incus-e2e.env"; set +a
          SUPERBOT_INCUS_E2E_BIN_DIR="$GITHUB_WORKSPACE/target/debug" "$(cat /tmp/test-bin)" --ignored --exact --nocapture \
            machines_incus_e2e_tests::real_incus_containers_enroll_stay_apart_and_follow_the_lifecycle
      - name: What Incus saw
        if: failure()
        run: |
          sudo incus version || true
          sudo incus list --all-projects || true
          for n in $(sudo incus list --project superbot -c n -f csv 2>/dev/null); do
            echo "::group::$n"
            sudo incus query "/1.0/instances/$n?project=superbot" | jq 'del(.config["cloud-init.user-data"])' || true
            sudo incus info --show-log "$n" --project superbot | tail -40 || true
            sudo incus exec "$n" --project superbot -- sh -c 'cloud-init status --long; tail -50 /var/log/cloud-init-output.log; journalctl -u superbot-machine --no-pager | tail -30' </dev/null || true
            echo "::endgroup::"
          done
          sudo incus network acl list --project superbot || true
          sudo journalctl -u incus --no-pager | tail -60 || true
          tail -40 "$RUNNER_TEMP/s3.log" || true

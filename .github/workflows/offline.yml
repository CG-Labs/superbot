name: offline

# Air-gapped installs (docs/adr/0128-air-gapped-self-host.md, docs/ops/air-gapped.md).
# install-offline: builds offline bundles from this commit, then installs, upgrades and refuses a
# downgrade with `install.sh --offline` as root inside a network namespace with no network at all.
# botd and Caddy join that namespace too (a systemd drop-in), so the HTTPS checks, run from inside
# it, show the services work with no network. It loads a bundled image into Docker the same way.
# It runs on the oldest and newest supported Ubuntu, with binaries built on the oldest. Packages the bundle doesn't carry (Caddy,
# sqlite3, ...) are installed first, as an operator would from their own mirror.
# It also bundles a multi-arch image from a local registry, checks the bundle keeps that
# registry's digest for this arch, loads it with no network, and pushes it to a second registry,
# a stand-in for an operator's mirror, with the same digest (docs/adr/0140-release-bundles-and-registry-mirrors.md).
# And it signs a two-arch image with SBOM and provenance attestations (a throwaway key, no
# transparency log), bundles it for both arches, and pushes both bundles to a third registry
# inside the namespace with no network: the mirror gets the signed index unchanged, and cosign
# verifies it, each arch, and the provenance there (docs/adr/0147-signatures-and-multi-arch-indexes-in-mirrors.md).
# It signs those two bundles with the same key and runs deploy/offline-release-check.sh on them,
# as for a published release: connected, then, inside the namespace, offline against the mirror
# (docs/adr/0172-release-bundles-checked-end-to-end.md).
# It builds a Hermes bundle, connected, and installs Hermes Agent from it with no network; an
# upgrade without --with-hermes keeps it (docs/adr/0200-hermes-agent-bundle-for-air-gapped-installs.md).
# release-bundle: for every v* tag, once the docker workflow has published and signed that tag's
# images (or by hand, for a published release), bundles them for each arch, with a Hermes bundle
# for each arch, signs each bundle with cosign keylessly under this workflow's identity, and
# attaches them to the release.
# release-check: then checks what was attached end to end, against ghcr.io and with no network
# (offline-release-check.yml, which also runs weekly on the latest release).

on:
  push:
    branches: [main]
    paths:
      - 'deploy/install.sh'
      - 'deploy/offline-bundle.sh'
      - 'deploy/test-offline.sh'
      - 'deploy/superbot*.sh'
      - 'deploy/hermes-share.sh'
      - 'deploy/*.service'
      - 'deploy/*.timer'
      - 'server/**'
      - 'site/**'
      - 'apps/client/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'deploy/offline-release-check.sh'
      - 'deploy/test-offline-release-check.sh'
      - '.github/workflows/offline.yml'
      - '.github/workflows/offline-release-check.yml'
  pull_request:
    paths:
      - 'deploy/install.sh'
      - 'deploy/offline-bundle.sh'
      - 'deploy/test-offline.sh'
      - 'deploy/superbot*.sh'
      - 'deploy/hermes-share.sh'
      - 'deploy/*.service'
      - 'deploy/*.timer'
      - 'server/**'
      - 'site/**'
      - 'apps/client/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'deploy/offline-release-check.sh'
      - 'deploy/test-offline-release-check.sh'
      - '.github/workflows/offline.yml'
      - '.github/workflows/offline-release-check.yml'
  # The docker workflow publishes and signs a tag's images; release-bundle starts when it is done.
  workflow_run:
    workflows: [docker]
    types: [completed]
  workflow_dispatch:
    inputs:
      version:
        description: 'A published release whose images are signed, e.g. 0.1.0 (its v<version> tag must exist)'
        required: true

permissions:
  contents: read

concurrency:
  group: offline-${{ github.event.workflow_run.head_branch || inputs.version || github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  install-offline:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    name: install-offline (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
      # C code (aws-lc, SQLCipher) built against 24.04's glibc headers won't link on 22.04.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.os }}
      - run: cargo build --release --bin botd --bin botctl --bin superbot-machine --bin superbot-run --bin superbot-oci
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/client/package-lock.json
      - name: Web client for /app/
        working-directory: apps/client
        env:
          CI: '1'
          EXPO_NO_TELEMETRY: '1'
          SUPERBOT_WEB_BASE_URL: /app
        run: npm ci --no-audit --no-fund && npx expo export --platform web --output-dir dist-app
      - name: The packages a bundle doesn't carry, as from the operator's mirror
        run: |
          set -euo pipefail
          curl -1sLf 'https://dl.cloudsmith.io/public/caddy/stable/gpg.key' | sudo gpg --dearmor -o /usr/share/keyrings/caddy-stable-archive-keyring.gpg
          curl -1sLf 'https://dl.cloudsmith.io/public/caddy/stable/debian.deb.txt' | sudo tee /etc/apt/sources.list.d/caddy-stable.list >/dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq caddy sqlite3 age bubblewrap socat acl shellcheck skopeo jq libatomic1
      - name: ShellCheck
        run: shellcheck -x -S style deploy/install.sh deploy/offline-bundle.sh deploy/test-offline.sh deploy/offline-release-check.sh deploy/test-offline-release-check.sh
      - name: Bundle checks without root (tampering, downgrades, certificates, the Caddyfile, a dry run)
        run: deploy/test-offline.sh
      - name: Release check without root (each refusal, with stand-ins for cosign and the registries)
        run: deploy/test-offline-release-check.sh
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
        with:
          driver-opts: network=host
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - name: Two registries on localhost, a source and a mirror, and a two-arch image in the source
        run: |
          set -euo pipefail
          docker run -d --name source-registry -p 127.0.0.1:5000:5000 registry:2 >/dev/null
          docker run -d --name mirror-registry -p 127.0.0.1:5001:5000 registry:2 >/dev/null
          sudo mkdir -p /etc/containers/registries.conf.d
          printf '[[registry]]\nlocation = "localhost:%s"\ninsecure = true\n\n' 5000 5001 \
            | sudo tee /etc/containers/registries.conf.d/50-offline-ci.conf >/dev/null
          mkdir -p "$RUNNER_TEMP/image"
          echo marker >"$RUNNER_TEMP/image/marker"
          printf 'FROM scratch\nCOPY marker /marker\nCMD ["/marker"]\n' >"$RUNNER_TEMP/image/Dockerfile"
          for _ in $(seq 1 30); do curl -fsS http://localhost:5000/v2/ >/dev/null 2>&1 && break; sleep 1; done
          docker buildx build -q --platform linux/amd64,linux/arm64 --push -t localhost:5000/superbot-offline-multi:1 "$RUNNER_TEMP/image" >/dev/null
          arch=$(case $(uname -m) in x86_64) echo amd64 ;; *) echo arm64 ;; esac)
          digest=$(skopeo inspect --raw docker://localhost:5000/superbot-offline-multi:1 \
            | jq -r --arg a "$arch" '.manifests[] | select(.platform.os == "linux" and .platform.architecture == $a) | .digest')
          [[ $digest == sha256:* ]]
          echo "MULTI_DIGEST=$digest" >>"$GITHUB_ENV"
          docker buildx build -q --load -t superbot-offline-ci:1 "$RUNNER_TEMP/image" >/dev/null
      - name: A signed two-arch image with SBOM and provenance, as the docker workflow publishes a release's
        working-directory: ${{ runner.temp }}
        env:
          COSIGN_PASSWORD: ''
        run: |
          set -euo pipefail
          docker buildx build -q --platform linux/amd64,linux/arm64 --sbom=true --provenance=mode=max --push \
            -t localhost:5000/superbot-offline-signed:1 image >/dev/null
          index=sha256:$(skopeo inspect --raw docker://localhost:5000/superbot-offline-signed:1 | sha256sum | cut -c1-64)
          echo "SIGNED_INDEX=$index" >>"$GITHUB_ENV"
          # A throwaway key and no transparency log: nothing about this image leaves the runner.
          cosign generate-key-pair >/dev/null
          cosign signing-config create --out signing-config.json
          cosign sign --yes --recursive --key cosign.key --signing-config signing-config.json "localhost:5000/superbot-offline-signed@$index"
          echo '{"buildType":"https://github.com/CG-Labs/superbot/offline-ci"}' >predicate.json
          cosign attest --yes --key cosign.key --signing-config signing-config.json --type slsaprovenance1 --predicate predicate.json \
            "localhost:5000/superbot-offline-signed@$index"
      - name: Two bundles, the first with a local and a registry image, and a certificate for offline.test
        run: |
          set -euo pipefail
          version=$(awk -F'"' '/^\[package\]/ { p = 1; next } /^\[/ { p = 0 } p && /^version *=/ { print $2; exit }' server/Cargo.toml)
          echo "OLD=$version-ci.1" >>"$GITHUB_ENV"
          echo "NEW=$version-ci.2" >>"$GITHUB_ENV"
          deploy/offline-bundle.sh build --out "$RUNNER_TEMP/b" --version "$version-ci.1" \
            --image ci=superbot-offline-ci:1 --image multi=localhost:5000/superbot-offline-multi:1 --allow-unsigned
          [[ $(tar -xOf "$RUNNER_TEMP/b/superbot-offline-$version-ci.1-$(uname -m).tar.gz" \
            "superbot-offline-$version-ci.1-$(uname -m)/images/multi.digest") == "$MULTI_DIGEST" ]]
          deploy/offline-bundle.sh build --out "$RUNNER_TEMP/b" --version "$version-ci.2"
          # Both arches' bundles of the signed image (the binaries are this runner's: only the
          # images and superbot-oci are used from these).
          for a in x86_64 aarch64; do
            deploy/offline-bundle.sh build --out "$RUNNER_TEMP/signed" --version "$version-ci.1" --arch "$a" \
              --image signed=localhost:5000/superbot-offline-signed:1 --image-key "$RUNNER_TEMP/cosign.pub"
            top=superbot-offline-$version-ci.1-$a
            [[ $(tar -xOf "$RUNNER_TEMP/signed/$top.tar.gz" "$top/images/signed.index") == "$SIGNED_INDEX" ]]
            tar -xOf "$RUNNER_TEMP/signed/$top.tar.gz" "$top/images/signed.sbom.spdx.json" | jq -e .spdxVersion >/dev/null
            tar -tf "$RUNNER_TEMP/signed/$top.tar.gz" "$top/signatures/signed.tar" "$top/bin/superbot-oci" >/dev/null
          done
          ls -l "$RUNNER_TEMP/b"
          openssl req -x509 -newkey ec -pkeyopt ec_paramgen_curve:P-256 -nodes -days 30 -subj /CN=offline.test \
            -addext subjectAltName=DNS:offline.test -keyout "$RUNNER_TEMP/tls.key" -out "$RUNNER_TEMP/tls.pem" 2>/dev/null
          echo '127.0.0.1 offline.test' | sudo tee -a /etc/hosts >/dev/null
          # The installer would take an existing botd's place; this runner has none.
          if id superbot 2>/dev/null; then exit 1; fi
      - name: A network namespace with only loopback, for the installer, botd and Caddy
        run: |
          set -euo pipefail
          sudo ip netns add offline
          sudo ip -n offline link set lo up
          for unit in superbot caddy; do
            sudo mkdir -p "/etc/systemd/system/$unit.service.d"
            printf '[Service]\nNetworkNamespacePath=/run/netns/offline\n' \
              | sudo tee "/etc/systemd/system/$unit.service.d/zz-offline-ci.conf" >/dev/null
          done
          sudo systemctl daemon-reload
          sudo systemctl restart caddy
          [[ $(sudo readlink "/proc/$(systemctl show -p MainPID --value caddy)/ns/net") == "$(sudo ip netns exec offline readlink /proc/self/ns/net)" ]]
      - name: Install from the bundle with no network
        run: |
          set -euo pipefail
          arch=$(uname -m)
          sudo ip netns exec offline bash -c '
            set -euo pipefail
            if curl -sS --max-time 5 https://github.com >/dev/null 2>&1; then echo "the network is still up" >&2; exit 1; fi
            bash "$1" --offline "$2" --domain offline.test --tls-cert "$3" --tls-key "$4" \
              --testing-mode --non-interactive --tz UTC
          ' _ deploy/install.sh "$RUNNER_TEMP/b/superbot-offline-$OLD-$arch.tar.gz" "$RUNNER_TEMP/tls.pem" "$RUNNER_TEMP/tls.key" | tee /tmp/offline-install.log
          grep -Fq "Offline bundle $OLD ($arch" /tmp/offline-install.log
          grep -Fq 'SuperBot is installed.' /tmp/offline-install.log
      - name: The offline install serves the operator's certificate and asked no CA
        run: |
          set -euo pipefail
          sudo systemctl is-active --quiet superbot
          [[ $(sudo readlink "/proc/$(systemctl show -p MainPID --value superbot)/ns/net") == "$(sudo ip netns exec offline readlink /proc/self/ns/net)" ]]
          curl() { sudo ip netns exec offline curl "$@"; }
          for _ in $(seq 1 30); do
            curl -fsS --cacert "$RUNNER_TEMP/tls.pem" https://offline.test/healthz >/dev/null 2>&1 && break
            sleep 1
          done
          curl -fsS --cacert "$RUNNER_TEMP/tls.pem" https://offline.test/healthz
          app=$(curl -fsS --cacert "$RUNNER_TEMP/tls.pem" https://offline.test/app/)
          grep -q '/app/_expo/static/js/web/entry-' <<<"$app"
          site=$(curl -fsS --cacert "$RUNNER_TEMP/tls.pem" https://offline.test/)
          grep -qi '<!doctype html' <<<"$site"
          grep -Fqx $'\ttls /etc/caddy/superbot-tls/cert.pem /etc/caddy/superbot-tls/key.pem' /etc/caddy/Caddyfile
          [[ $(sudo stat -c '%U:%G %a' /etc/caddy/superbot-tls/key.pem) == 'root:caddy 640' ]]
          logs=$(sudo journalctl -u caddy --no-pager)
          if grep -Ei 'obtain|acme-v02|letsencrypt|zerossl|ocsp' <<<"$logs"; then echo "Caddy tried a CA" >&2; exit 1; fi
          grep -qx "version=$OLD" /usr/local/share/superbot/offline-release
          [[ $(stat -c '%U %a' /usr/local/bin/botd) == 'root 755' ]]
          if sudo test -e /home/superbot/superbot/.git; then echo "an offline install has no checkout" >&2; exit 1; fi
          sudo journalctl -u superbot --no-pager | tail -n 20
      - name: Upgrade from a newer bundle with no network; refuse the older one again
        run: |
          set -euo pipefail
          arch=$(uname -m)
          curl() { sudo ip netns exec offline curl "$@"; }
          before=$(sudo systemctl show -p ExecMainStartTimestampMonotonic --value superbot)
          sudo ip netns exec offline bash deploy/install.sh --offline "$RUNNER_TEMP/b/superbot-offline-$NEW-$arch.tar.gz" --upgrade \
            --domain offline.test --tls-cert "$RUNNER_TEMP/tls.pem" --tls-key "$RUNNER_TEMP/tls.key" --non-interactive --tz UTC \
            | tee /tmp/offline-upgrade.log
          grep -Fq "Offline upgrade: $OLD -> $NEW" /tmp/offline-upgrade.log
          grep -qx "version=$NEW" /usr/local/share/superbot/offline-release
          [[ $(sudo systemctl show -p ExecMainStartTimestampMonotonic --value superbot) != "$before" ]]
          for _ in $(seq 1 30); do
            curl -fsS --cacert "$RUNNER_TEMP/tls.pem" https://offline.test/healthz >/dev/null 2>&1 && break
            sleep 1
          done
          curl -fsS --cacert "$RUNNER_TEMP/tls.pem" https://offline.test/healthz
          if sudo ip netns exec offline bash deploy/install.sh --offline "$RUNNER_TEMP/b/superbot-offline-$OLD-$arch.tar.gz" --upgrade \
            --domain offline.test --tls-cert "$RUNNER_TEMP/tls.pem" --tls-key "$RUNNER_TEMP/tls.key" --non-interactive --tz UTC \
            >/tmp/offline-downgrade.log 2>&1; then
            echo "a downgrade was allowed" >&2; exit 1
          fi
          grep -Fq "newer than the bundle's $OLD" /tmp/offline-downgrade.log
          grep -qx "version=$NEW" /usr/local/share/superbot/offline-release
          sudo systemctl is-active --quiet superbot
      # Connected, as an operator makes it once per Hermes pin; then nothing below has a network.
      - name: A Hermes bundle, built with the network
        run: |
          set -euo pipefail
          df -h / | tail -n 1
          sudo deploy/offline-bundle.sh hermes --out "$RUNNER_TEMP/h"
          sudo chown -R "$(id -u):$(id -g)" "$RUNNER_TEMP/h"
          hb=$(ls "$RUNNER_TEMP"/h/superbot-hermes-*-"$(uname -m)".tar.gz)
          deploy/offline-bundle.sh verify "$hb"
          echo "HB=$hb" >>"$GITHUB_ENV"
          ls -l "$RUNNER_TEMP/h"
          df -h / | tail -n 1
      - name: Install Hermes Agent from its bundle with no network; an upgrade without it keeps it
        run: |
          set -euo pipefail
          arch=$(uname -m)
          commit=$(sed -n 's/^HERMES_COMMIT=.*:-\([0-9a-f]\{40\}\)}.*/\1/p' deploy/install.sh)
          [[ $commit =~ ^[0-9a-f]{40}$ ]]
          upgrade() {
            sudo ip netns exec offline bash deploy/install.sh --offline "$RUNNER_TEMP/b/superbot-offline-$NEW-$arch.tar.gz" --upgrade \
              --domain offline.test --tls-cert "$RUNNER_TEMP/tls.pem" --tls-key "$RUNNER_TEMP/tls.key" --non-interactive --tz UTC "$@"
          }
          if sudo ip netns exec offline curl -sS --max-time 5 https://github.com >/dev/null 2>&1; then echo "the network is still up" >&2; exit 1; fi
          upgrade --with-hermes --hermes-bundle "$HB" | tee /tmp/offline-hermes.log
          grep -Fq "Hermes bundle: Hermes Agent" /tmp/offline-hermes.log
          grep -Fq "Installing Hermes Agent ${commit:0:12} system-wide in /opt/hermes from the Hermes bundle" /tmp/offline-hermes.log
          [[ $(readlink /usr/local/bin/hermes) == /opt/hermes/.hermes/superbot/hermes ]]
          [[ $(sudo stat -c '%U %a' /opt/hermes) == 'root 755' ]]
          if ls -d /opt/.superbot-hermes.* 2>/dev/null; then echo "the Hermes bundle's staging was left behind" >&2; exit 1; fi
          probe=$(mktemp -d) && chmod 0777 "$probe"
          sudo ip netns exec offline sudo -u nobody env HOME="$probe" HERMES_HOME="$probe/h" /usr/local/bin/hermes --version | tee /tmp/offline-hermes-version.log
          grep -q '^Hermes Agent v' /tmp/offline-hermes-version.log
          sudo ip netns exec offline sudo -u superbot env HOME="$probe" HERMES_HOME="$probe/s" hermes --version >/dev/null
          sudo rm -rf "$probe"
          sudo systemctl is-active --quiet superbot
          sudo touch /opt/hermes/.ci-marker
          upgrade | tee /tmp/offline-hermes-kept.log
          if grep -E 'Installing Hermes Agent|Unpacking Hermes Agent|this release pins' /tmp/offline-hermes-kept.log; then echo "an upgrade without --with-hermes touched Hermes Agent" >&2; exit 1; fi
          sudo test -e /opt/hermes/.ci-marker
          upgrade --with-hermes --hermes-bundle "$HB" | tee /tmp/offline-hermes-again.log
          grep -Fq "Hermes Agent ${commit:0:12} is already installed in /opt/hermes" /tmp/offline-hermes-again.log
          sudo test -e /opt/hermes/.ci-marker
          sudo systemctl is-active --quiet superbot
      - name: Load the bundle's images into Docker with no network
        run: |
          set -euo pipefail
          docker rmi -f superbot-offline-ci:1 localhost:5000/superbot-offline-multi:1 >/dev/null 2>&1 || true
          sudo unshare --net -- deploy/offline-bundle.sh load "$RUNNER_TEMP/b/superbot-offline-$OLD-$(uname -m).tar.gz"
          docker image inspect superbot-offline-ci:1 >/dev/null
          arch=$(case $(uname -m) in x86_64) echo amd64 ;; *) echo arm64 ;; esac)
          [[ $(docker image inspect --format '{{.Architecture}}' localhost:5000/superbot-offline-multi:1) == "$arch" ]]
          sudo unshare --net -- deploy/offline-bundle.sh load "$RUNNER_TEMP/signed/superbot-offline-$OLD-$(uname -m).tar.gz"
          [[ $(docker image inspect --format '{{.Architecture}}' localhost:5000/superbot-offline-signed:1) == "$arch" ]]
      - name: Push the bundle's images to a mirror, with the source registry's digest
        run: |
          set -euo pipefail
          # --sha256 as an operator gives it, from where the bundle was published: a bundle's
          # superbot-oci runs only once the bundle is checked against it or a signature.
          b="$RUNNER_TEMP/b/superbot-offline-$OLD-$(uname -m).tar.gz"
          deploy/offline-bundle.sh push "$b" --sha256 "$(cut -c1-64 "$b.sha256")" --registry localhost:5001/mirror \
            | tee /tmp/offline-push.log
          [[ $(skopeo inspect --raw docker://localhost:5001/mirror/superbot-offline-multi:1 | sha256sum | cut -c1-64) == "${MULTI_DIGEST#sha256:}" ]]
          grep -Fq "to localhost:5001/mirror/superbot-offline-multi:1 ($MULTI_DIGEST" /tmp/offline-push.log
          docker rmi -f localhost:5000/superbot-offline-multi:1 >/dev/null 2>&1 || true
          docker pull -q "localhost:5001/mirror/superbot-offline-multi@$MULTI_DIGEST" >/dev/null
      # As release-bundle signs a release's bundles, with the throwaway key instead of keyless.
      - name: Sign both arches' bundles, and check them as a published release, connected
        working-directory: ${{ runner.temp }}
        env:
          COSIGN_PASSWORD: ''
        run: |
          set -euo pipefail
          for a in x86_64 aarch64; do
            f=signed/superbot-offline-$OLD-$a.tar.gz
            cosign sign-blob --yes --key cosign.key --signing-config signing-config.json --bundle "$f.sigstore.json" "$f" >/dev/null
          done
          "$GITHUB_WORKSPACE/deploy/offline-release-check.sh" online signed --version "$OLD" --commit "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" \
            --image signed=localhost:5000/superbot-offline-signed:1 --key cosign.pub --any-binary-arch
          grep -qx "image signed localhost:5000/superbot-offline-signed:1 $SIGNED_INDEX" signed/release-check.expected
      # The mirror is a registry binary run inside the namespace, so nothing here has a network.
      - name: Push both arches' bundles to a mirror with no network; cosign verifies the signed index there
        run: |
          set -euo pipefail
          id=$(docker create registry:2)
          docker cp "$id:/bin/registry" "$RUNNER_TEMP/registry"
          docker rm "$id" >/dev/null
          printf 'version: 0.1\nlog: {level: error}\nstorage: {filesystem: {rootdirectory: %s}}\nhttp: {addr: 127.0.0.1:5002}\n' \
            "$RUNNER_TEMP/offline-mirror" >"$RUNNER_TEMP/registry.yml"
          printf '[[registry]]\nlocation = "localhost:5002"\ninsecure = true\n' \
            | sudo tee /etc/containers/registries.conf.d/51-offline-mirror.conf >/dev/null
          sudo ip netns exec offline env PATH="$(dirname "$(command -v cosign)"):$PATH" bash -c '
            set -euo pipefail
            registry=$1 config=$2 bundles=$3 index=$4 key=$5
            if curl -sS --max-time 5 https://github.com >/dev/null 2>&1; then echo "the network is still up" >&2; exit 1; fi
            "$registry" serve "$config" >/tmp/offline-mirror-registry.log 2>&1 &
            trap "kill $!" EXIT
            for _ in $(seq 1 30); do curl -fsS http://localhost:5002/v2/ >/dev/null 2>&1 && break; sleep 1; done
            deploy/offline-release-check.sh offline "$bundles" --mirror localhost:5002/mirror --key "$key" 2>&1 | tee /tmp/offline-signed-push.log
            grep -Fq "to localhost:5002/mirror/superbot-offline-signed:1 ($index, the signed index for linux/amd64, linux/arm64)" /tmp/offline-signed-push.log
            grep -Fq "signed: localhost:5002/mirror/superbot-offline-signed:1 is the signed index $index; it, its 4 manifests and its provenance verify with no network" /tmp/offline-signed-push.log
            manifest() { curl -fsS -H "Accept: application/vnd.oci.image.index.v1+json, application/vnd.oci.image.manifest.v1+json" "http://localhost:5002/v2/mirror/superbot-offline-signed/manifests/$1"; }
            # The SBOM and provenance attestations from BuildKit went up with the index, for both arches.
            [[ $(manifest 1 | jq "[.manifests[] | select(.annotations[\"vnd.docker.reference.type\"] == \"attestation-manifest\")] | length") == 2 ]]
          ' _ "$RUNNER_TEMP/registry" "$RUNNER_TEMP/registry.yml" "$RUNNER_TEMP/signed" "$SIGNED_INDEX" "$RUNNER_TEMP/cosign.pub"
      - name: Logs on failure
        if: failure()
        run: |
          sudo journalctl -u superbot -u caddy --no-pager | tail -n 80 || true
          cat /tmp/offline-*.log 2>/dev/null || true

  release-bundle:
    # A tag's docker run that published its images, in this repository; or a manual run.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      startsWith(github.event.workflow_run.head_branch, 'v'))
    name: release-bundle (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-22.04
          - arch: aarch64
            runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: write
      id-token: write
    env:
      # For a tag's docker run, head_branch is the tag.
      TAG: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.event.workflow_run.head_branch }}
      TAG_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - name: The tag is a version tag
        run: |
          [[ $TAG =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || { echo "::error::$TAG isn't a v<version> tag"; exit 1; }
          echo "VERSION=${TAG#v}" >>"$GITHUB_ENV"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: refs/tags/${{ env.TAG }}
          fetch-depth: 0
          persist-credentials: false
      - name: The tag is on main, and is the commit whose images the docker workflow published
        run: |
          git merge-base --is-ancestor HEAD origin/main \
            || { echo "::error::$TAG isn't on main; release only from main (ADR 0111)"; exit 1; }
          [[ -z $TAG_SHA || $(git rev-parse HEAD) == "$TAG_SHA" ]] \
            || { echo "::error::$TAG is $(git rev-parse HEAD), but the docker workflow published $TAG_SHA"; exit 1; }
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
      - run: cargo build --release --bin botd --bin botctl --bin superbot-machine --bin superbot-run --bin superbot-oci
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/client/package-lock.json
      - name: Web client for /app/
        working-directory: apps/client
        env:
          CI: '1'
          EXPO_NO_TELEMETRY: '1'
          SUPERBOT_WEB_BASE_URL: /app
        run: npm ci --no-audit --no-fund && npx expo export --platform web --output-dir dist-app
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - name: skopeo and jq, to copy the images with their registry digests
        run: |
          if ! command -v skopeo >/dev/null || ! command -v jq >/dev/null; then
            sudo apt-get update -qq && sudo apt-get install -y -qq skopeo jq
          fi
      # The images' signatures are checked against the docker workflow at this tag before they
      # are bundled (ADR 0101); the bundle's own signature is this workflow's.
      - name: Bundle, with the release's signed images and their SBOMs
        run: |
          set -euo pipefail
          deploy/offline-bundle.sh build --out dist --version "$VERSION" \
            --image "superbot=ghcr.io/${GITHUB_REPOSITORY,,}:$VERSION" \
            --image "caddy=ghcr.io/${GITHUB_REPOSITORY,,}-caddy:$VERSION" \
            --image-identity "https://github.com/$GITHUB_REPOSITORY/.github/workflows/docker.yml@refs/tags/v$VERSION"
      - name: Sign the bundle
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          f=dist/superbot-offline-$VERSION-$ARCH.tar.gz
          cosign sign-blob --yes --bundle "$f.sigstore.json" "$f"
          deploy/offline-bundle.sh verify "$f"
          cat "$f.sha256" >>"$GITHUB_STEP_SUMMARY"
      # Hermes Agent at the pinned commit, for --offline --with-hermes (ADR 0200).
      - name: Bundle Hermes Agent, and sign it
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          sudo deploy/offline-bundle.sh hermes --out "$RUNNER_TEMP/h"
          sudo chown -R "$(id -u):$(id -g)" "$RUNNER_TEMP/h"
          for f in "$RUNNER_TEMP"/h/superbot-hermes-*-"$ARCH".tar.gz; do
            cosign sign-blob --yes --bundle "$f.sigstore.json" "$f"
            deploy/offline-bundle.sh verify "$f"
            cat "$f.sha256" >>"$GITHUB_STEP_SUMMARY"
            mv "$f" "$f.sha256" "$f.sigstore.json" dist/
          done
      # The release workflow makes the release from the same tag, usually long before this.
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          for _ in $(seq 1 60); do gh release view "$TAG" >/dev/null 2>&1 && break; sleep 10; done
          gh release view "$TAG" >/dev/null || { echo "::error::No GitHub release for $TAG: the release workflow makes it"; exit 1; }
          gh release upload "$TAG" dist/superbot-offline-* --clobber
          gh release upload "$TAG" dist/superbot-hermes-* --clobber

  release-check:
    # What release-bundle attached, checked end to end as a customer uses it (ADR 0172).
    needs: release-bundle
    permissions:
      contents: read
    uses: ./.github/workflows/offline-release-check.yml
    with:
      tag: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.event.workflow_run.head_branch }}

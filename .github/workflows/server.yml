name: server

on:
  push:
    paths:
      - 'server/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'deploy/**'
      - 'site/**'
      - 'web/**'
      - 'apps/client/**'
      - '.github/workflows/server.yml'
  pull_request:
    paths:
      - 'server/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'deploy/**'
      - 'site/**'
      - 'web/**'
      - 'apps/client/**'
      - '.github/workflows/server.yml'

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release
      - name: Keep the release binaries for the backup drill
        uses: actions/upload-artifact@v4
        with:
          name: botd-release
          path: |
            target/release/botd
            target/release/botctl
          retention-days: 1
      - run: cargo test

  backup-drill:
    needs: rust
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: botd-release
          path: /tmp/botd-release
      - name: Install age and sqlite3
        run: sudo apt-get update -qq && sudo apt-get install -y -qq age sqlite3
      - name: Backup and restore drill (installer units, encrypted archive, fresh host, RTO and RPO budgets)
        run: sudo SUPERBOT_DRILL_THROWAWAY=1 GITHUB_ACTIONS="$GITHUB_ACTIONS" deploy/backup-drill.sh /tmp/botd-release

  # Per-user accounts (ADR 0037) on a real host: accounts, sudo, and the unit's sandboxing.
  isolation:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build superbot-run and botd's tests
        run: |
          set -euo pipefail
          cargo build --bin superbot-run
          cargo test --no-run --message-format=json >/tmp/build.json
          jq -r 'select(.reason == "compiler-artifact" and .target.name == "botd" and .target.kind == ["bin"] and .profile.test) | .executable' \
            /tmp/build.json >/tmp/test-bin
          test -x "$(cat /tmp/test-bin)"
      - name: User B's Bot can't reach user A's folder or logins
        run: |
          sudo apt-get update -qq
          sudo deploy/test-isolation.sh --yes target/debug/superbot-run "$(cat /tmp/test-bin)"
      # ADR 0043: the machine agent makes the Bots' own user and runs everything as it.
      - name: Bots on a machine run as their own OS user
        run: |
          cp "$(cat /tmp/test-bin)" /tmp/botd-tests
          sudo SUPERBOT_MACHINE_BOT_USER_TEST=1 /tmp/botd-tests --ignored --exact \
            machines_bot_user_tests::as_root_bots_get_their_own_os_user_and_cant_reach_the_agents_files

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ShellCheck
        run: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
      - run: shellcheck -S warning deploy/*.sh deploy/docker/*.sh

  backup-scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install age and sqlite3
        run: sudo apt-get update -qq && sudo apt-get install -y -qq age sqlite3
      - run: deploy/test-backup.sh

  install-pipe-dry-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Installer checks without root (pipes under pipefail, web client archive, loud client failures)
        run: deploy/test-install.sh
      - name: Piped dry run on a fresh host (no user, no clone)
        run: |
          set -euo pipefail
          if id superbot 2>/dev/null || [[ -e /home/superbot ]]; then exit 1; fi
          cat deploy/install.sh | sudo bash -s -- --dry-run --non-interactive \
            --domain ci.example.com --tz UTC | tee /tmp/fresh.log
          grep -Fq 'would fetch https://github.com/CG-Labs/superbot.git (main) into root-owned /usr/local/share/superbot/src.git' /tmp/fresh.log
          grep -Fq 'would render /etc/systemd/system/superbot.service from /usr/local/share/superbot/deploy/superbot.service (User=superbot, ExecStart=/usr/local/bin/botd)' /tmp/fresh.log
          grep -Fq 'SuperBot is installed.' /tmp/fresh.log
          grep -Fq 'would keep or create master key /home/superbot/.config/superbot/master.key' /tmp/fresh.log
          grep -Fq 'would build the web client in /home/superbot/superbot/apps/client as superbot (base URL /app) and install it into root-owned /var/www/superbot-app' /tmp/fresh.log
          grep -Fq 'web client at /app/ from /var/www/superbot-app, everything else to botd on 127.0.0.1:3000' /tmp/fresh.log
          grep -Fq 'App:      https://ci.example.com/app/' /tmp/fresh.log
          grep -Fq 'would install the landing page from /home/superbot/superbot/site into root-owned /var/www/superbot-site' /tmp/fresh.log
          grep -Fq 'landing page at / from /var/www/superbot-site, web client at /app/' /tmp/fresh.log
          grep -Fq 'Console:  https://ci.example.com/console/' /tmp/fresh.log
      - name: Per-user accounts are opt-in
        run: |
          set -euo pipefail
          if grep -Eq 'superbot-isolation|Per-user accounts' /tmp/fresh.log; then exit 1; fi
          cat deploy/install.sh | sudo bash -s -- --dry-run --non-interactive --isolation \
            --domain ci.example.com --tz UTC | tee /tmp/isolation.log
          grep -Fq 'would install /usr/local/sbin/superbot-userctl, /etc/sudoers.d/superbot-isolation, and /etc/systemd/system/superbot.service.d/isolation.conf, make /srv/superbot/users (root, 0711)' /tmp/isolation.log
          grep -Fq 'Per-user accounts are on (ISOLATION=users' /tmp/isolation.log
      - name: Hermes Agent is opt-in and pinned to a commit
        run: |
          set -euo pipefail
          if grep -Eq 'would (install Hermes|set PATH)' /tmp/fresh.log; then exit 1; fi
          cat deploy/install.sh | sudo bash -s -- --dry-run --non-interactive --with-hermes \
            --domain ci.example.com --tz UTC | tee /tmp/hermes.log
          grep -Eq 'would install Hermes Agent [0-9a-f]{40} for superbot from https://raw\.githubusercontent\.com/NousResearch/hermes-agent/[0-9a-f]{40}/scripts/install\.sh$' /tmp/hermes.log
          grep -Fq 'would set PATH=/home/superbot/.local/bin:/usr/local/sbin:/usr/local/bin:' /tmp/hermes.log
          if cat deploy/install.sh | sudo HERMES_COMMIT=main bash -s -- --dry-run --non-interactive --with-hermes \
            --domain ci.example.com --tz UTC; then exit 1; fi
      - name: Piped dry run of an upgrade without the client
        run: |
          set -euo pipefail
          cat deploy/install.sh | sudo bash -s -- --dry-run --non-interactive --upgrade --no-client \
            --domain ci.example.com --tz UTC | tee /tmp/upgrade.log
          grep -Fq 'Skipping the web client (--no-client)' /tmp/upgrade.log
          if grep -Fq 'would build the web client' /tmp/upgrade.log; then exit 1; fi
          if grep -Fq 'web client at /app/' /tmp/upgrade.log; then exit 1; fi
          grep -Fq 'would install the landing page' /tmp/upgrade.log
      - name: Piped dry run ignores templates in the service user's checkout
        run: |
          set -euo pipefail
          sudo useradd -m -s /bin/bash superbot
          sudo -u superbot mkdir -p /home/superbot/superbot/deploy
          printf '[Service]\nUser=root\nExecStart=/bin/sh -c id\n' | sudo -u superbot tee /home/superbot/superbot/deploy/superbot.service >/dev/null
          cat deploy/install.sh | sudo bash -s -- --dry-run --non-interactive \
            --domain ci.example.com --tz UTC | tee /tmp/poisoned.log
          if grep -Fq '/home/superbot/superbot/deploy' /tmp/poisoned.log; then exit 1; fi
          grep -Fq 'from /usr/local/share/superbot/deploy/superbot.service' /tmp/poisoned.log
      - name: Master key is made once, privately, and never replaced
        run: |
          set -euo pipefail
          command -v sqlite3 >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq sqlite3; }
          id superbot >/dev/null 2>&1 || sudo useradd -m -s /bin/bash superbot
          sudo -u superbot mkdir -p /home/superbot/superbot/data
          printf 'AUTH_PASSWORD=x\n' | sudo -u superbot tee /home/superbot/superbot/.env >/dev/null
          sudo env SUPERBOT_INSTALL_NO_MAIN=1 bash <<'EOF'
          set -euo pipefail
          source deploy/install.sh
          env_file=/home/superbot/superbot/.env
          key=/home/superbot/.config/superbot/master.key
          ensure_master_key
          [[ $(stat -c '%U %a' "$key") == 'superbot 600' ]]
          [[ $(stat -c %a "$(dirname "$key")") == 700 ]]
          [[ $(base64 -d "$key" | wc -c) == 32 ]]
          grep -qx "SUPERBOT_MASTER_KEY_FILE=$key" "$env_file"
          before=$(sha256sum "$key")
          ensure_master_key
          [[ $(sha256sum "$key") == "$before" ]]
          [[ $(grep -c '^SUPERBOT_MASTER_KEY_FILE=' "$env_file") == 1 ]]
          # A quoted custom path is read without its quotes.
          custom=/home/superbot/.config/superbot/custom.key
          sed -i "s|^SUPERBOT_MASTER_KEY_FILE=.*|SUPERBOT_MASTER_KEY_FILE=\"$custom\"|" "$env_file"
          ensure_master_key
          [[ $(stat -c '%U %a' "$custom") == 'superbot 600' ]]
          grep -qx "SUPERBOT_MASTER_KEY_FILE=$custom" "$env_file"
          # Never inside DATA_DIR, which backups copy.
          sed -i "s|^SUPERBOT_MASTER_KEY_FILE=.*|SUPERBOT_MASTER_KEY_FILE=/home/superbot/superbot/data/master.key|" "$env_file"
          if (ensure_master_key); then exit 1; fi
          [[ ! -e /home/superbot/superbot/data/master.key ]]
          sed -i "s|^SUPERBOT_MASTER_KEY_FILE=.*|SUPERBOT_MASTER_KEY_FILE=$key|" "$env_file"
          # A password file is kept: no AUTH_PASSWORD is generated beside it.
          sed -i 's|^AUTH_PASSWORD=x$|AUTH_PASSWORD_FILE=/run/superbot-password|' "$env_file"
          configure_env
          if grep -q '^AUTH_PASSWORD=' "$env_file"; then exit 1; fi
          # A lost key with sealed data: stop rather than make a key that can't open it.
          mv "$key" /tmp/old.key
          sudo -u superbot sqlite3 /home/superbot/superbot/data/app.sqlite \
            "CREATE TABLE settings (key TEXT PRIMARY KEY, value TEXT); INSERT INTO settings VALUES ('secrets_key_check', 'sb1:x');"
          if (ensure_master_key); then exit 1; fi
          [[ ! -e "$key" ]]
          echo ok
          EOF
      - name: A license key is checked early and saved privately by the service user
        run: |
          set -euo pipefail
          printf 'eyJhbGciOiJFZERTQSJ9.eyJzdWIiOiJ4In0.c2ln\n' >/tmp/license.key
          cat deploy/install.sh | sudo bash -s -- --dry-run --non-interactive --license-file /tmp/license.key \
            --domain ci.example.com --tz UTC | tee /tmp/license.log
          grep -Fq 'would install the license key from /tmp/license.key as /home/superbot/superbot/data/license.key (0600, superbot)' /tmp/license.log
          printf 'not a license\n' >/tmp/bad.key
          if cat deploy/install.sh | sudo bash -s -- --dry-run --non-interactive --license-file /tmp/bad.key --tz UTC; then exit 1; fi
          if cat deploy/install.sh | sudo bash -s -- --dry-run --non-interactive --license-file /tmp/missing.key --tz UTC; then exit 1; fi
          id superbot >/dev/null 2>&1 || sudo useradd -m -s /bin/bash superbot
          sudo -u superbot mkdir -p /home/superbot/superbot
          sudo env SUPERBOT_INSTALL_NO_MAIN=1 LICENSE_FILE=/tmp/license.key bash -c '
            set -euo pipefail
            source deploy/install.sh
            LICENSE_FILE=/tmp/license.key
            check_license_file
            install_license
            dest=/home/superbot/superbot/data/license.key
            [[ $(stat -c "%U %a" "$dest") == "superbot 600" ]]
            [[ $(cat "$dest") == "eyJhbGciOiJFZERTQSJ9.eyJzdWIiOiJ4In0.c2ln" ]]
            echo ok'
      - name: .env values are written as given
        run: |
          set -euo pipefail
          env_file=$(mktemp)
          printf 'USER_NAME=Owner\nUSER_NAME_OLD=keep\n' >"$env_file"
          SUPERBOT_INSTALL_NO_MAIN=1 bash -c '
            set -euo pipefail
            source deploy/install.sh
            set_env_var "$1" USER_NAME "Alice & Bob | C:\\x \$(id)"
            set_env_var "$1" TZ "Europe/Jersey"
            if (set_env_var "$1" TZ "a
          b"); then exit 1; fi
          ' _ "$env_file"
          diff "$env_file" - <<'EOF'
          USER_NAME=Alice & Bob | C:\x $(id)
          USER_NAME_OLD=keep
          TZ=Europe/Jersey
          EOF
      - name: Root stages templates from its own fetch and renders fixed units
        run: |
          set -euo pipefail
          sudo cp -a "$GITHUB_WORKSPACE" /tmp/src
          sudo chown -R root:root /tmp/src
          sudo env SUPERBOT_INSTALL_NO_MAIN=1 SHARE_DIR=/tmp/share SYSTEMD_DIR=/tmp/units \
            REPO_URL=file:///tmp/src REPO_BRANCH=HEAD bash -c '
            set -euo pipefail
            source deploy/install.sh
            stage_trusted_deploy
            for f in "${DEPLOY_FILES[@]}"; do
              cmp "$SHARE_DIR/deploy/$f" "deploy/$f"
              [[ $(stat -c %U "$SHARE_DIR/deploy/$f") == root ]]
            done
            mkdir -p "$SYSTEMD_DIR"
            render_unit "$SHARE_DIR/deploy/superbot.service" "$SYSTEMD_DIR/superbot.service" "$(service_unit_fixed /home/superbot)"
            render_unit "$SHARE_DIR/deploy/superbot-backup.service" "$SYSTEMD_DIR/superbot-backup.service" "$(backup_unit_fixed /home/superbot)"
            render_unit "$SHARE_DIR/deploy/superbot-backup.timer" "$SYSTEMD_DIR/superbot-backup.timer" ""
            [[ $(grep -c "^User=" "$SYSTEMD_DIR/superbot.service") == 1 ]]
            grep -qx "User=superbot" "$SYSTEMD_DIR/superbot.service"
            grep -qx "ExecStart=/usr/local/bin/botd" "$SYSTEMD_DIR/superbot.service"
            grep -qx "ExecStart=/usr/local/bin/superbot-backup --home /home/superbot" "$SYSTEMD_DIR/superbot-backup.service"
            grep -qx "OnCalendar=\*-\*-\* 03:15:00" "$SYSTEMD_DIR/superbot-backup.timer"
            printf "[Service]\nUser=root\nExecStart=/bin/sh\n" >/tmp/evil-identity.service
            render_unit /tmp/evil-identity.service /tmp/out.service "$(service_unit_fixed /home/superbot)"
            if grep -q root /tmp/out.service; then exit 1; fi
            printf "[Service]\nExecStartPre=/bin/sh -c id\n" >/tmp/evil-pre.service
            if (render_unit /tmp/evil-pre.service /tmp/out2.service "$(service_unit_fixed /home/superbot)"); then exit 1; fi
            if (INSTALL_DIR=/home/superbot/superbot; stage_trusted_deploy); then exit 1; fi
            echo ok
          '
      - name: Web client and landing page are installed root-owned and served by Caddy
        run: |
          set -euo pipefail
          id superbot >/dev/null 2>&1 || sudo useradd -m -s /bin/bash superbot
          sudo -u superbot -H bash -lc 'node -v && npm -v'
          sudo rm -rf /home/superbot/superbot
          sudo cp -a "$GITHUB_WORKSPACE" /home/superbot/superbot
          sudo chown -R superbot:superbot /home/superbot/superbot
          # A manual build from before releases, as on servers set up by hand.
          sudo mkdir -p /var/www/superbot-app
          echo manual | sudo tee /var/www/superbot-app/index.html >/dev/null
          sudo env SUPERBOT_INSTALL_NO_MAIN=1 bash -c '
            set -euo pipefail
            source deploy/install.sh
            dist=/home/superbot/superbot/apps/client/dist-app
            build_client
            [[ -L "$CLIENT_DIR" ]]
            live=$(readlink -f "$CLIENT_DIR")
            [[ $(stat -c "%U %a" "$live") == "root 755" ]]
            [[ $(stat -c "%U %a" "$live/index.html") == "root 644" ]]
            [[ -z $(find "$live" ! -user root) ]]
            grep -q "/app/_expo/static/js/web/entry-" "$live/index.html"
            grep -qx manual "$(client_releases_dir)"/previous-*/index.html
            # An upgrade swaps in a new release and keeps only the previous one.
            install_client "$dist"
            [[ $(readlink -f "$CLIENT_DIR") != "$live" ]]
            [[ $(find "$(client_releases_dir)" -mindepth 1 -maxdepth 1 | wc -l) == 2 ]]
            # A big build installs every time: checking its listing never trips pipefail.
            sudo -u superbot mkdir "$dist"/bulk-{01..50}
            printf "%s\n" "$dist"/bulk-{01..50}/chunk-{001..600}.js | sudo -u superbot xargs touch
            for _ in 1 2 3; do install_client "$dist"; done
            [[ -f $(readlink -f "$CLIENT_DIR")/bulk-50/chunk-600.js ]]
            sudo -u superbot rm -rf "$dist"/bulk-*
            [[ $(find "$(client_releases_dir)" -mindepth 1 -maxdepth 1 | wc -l) == 2 ]]
            # A failure while unpacking leaves the live client and no half-made release.
            live=$(readlink -f "$CLIENT_DIR")
            if (chown() { return 1; }; install_client "$dist"); then exit 1; fi
            [[ $(readlink -f "$CLIENT_DIR") == "$live" ]]
            [[ $(find "$(client_releases_dir)" -mindepth 1 -maxdepth 1 | wc -l) == 2 ]]
            # A build holding a link, or without index.html, is refused; the live client stays.
            sudo -u superbot ln -s /etc/shadow "$dist/leak"
            if (install_client "$dist"); then exit 1; fi
            sudo -u superbot rm "$dist/leak" "$dist/index.html"
            if (install_client "$dist"); then exit 1; fi
            [[ $(readlink -f "$CLIENT_DIR") == "$live" ]]
            # No Node for the service user: a warning, not a failed install.
            client_node_ok() { return 1; }
            grep -q "skipping the web client" <<<"$(build_client 2>&1)"
            # The landing page: plain files, installed like the client; a link is refused.
            install_site
            site=$(readlink -f "$SITE_DIR")
            [[ $(stat -c "%U %a" "$site/get-started.html") == "root 644" ]]
            sudo -u superbot ln -s /etc/shadow /home/superbot/superbot/site/leak
            grep -q "Landing page not installed" <<<"$(install_site 2>&1)"
            [[ $(readlink -f "$SITE_DIR") == "$site" ]]
            sudo -u superbot rm /home/superbot/superbot/site/leak
            render_caddyfile :18090 127.0.0.1:3999 "$CLIENT_DIR" "$SITE_DIR" >/tmp/Caddyfile
            echo ok
          '
          docker run -d --name caddy --network host \
            -v /tmp/Caddyfile:/etc/caddy/Caddyfile:ro -v /var/www:/var/www:ro caddy:2
          trap 'docker logs caddy 2>&1 | tail -20; docker rm -f caddy >/dev/null' EXIT
          B=http://127.0.0.1:18090
          for _ in $(seq 1 30); do curl -fsS -o /dev/null "$B/app/" && break; sleep 1; done
          code() { curl -s -o /dev/null -w '%{http_code}' "$@"; }
          [[ $(code "$B/app/") == 200 ]]
          [[ $(code "$B/app") == 302 ]]
          [[ $(code "$B/app/some/deep/link") == 200 ]]
          grep -qi '^cache-control: no-cache' <<<"$(curl -fsSI "$B/app/")"
          js=$(curl -fsS "$B/app/" | grep -o '/app/_expo/static/js/web/entry-[0-9a-f]*\.js' | sed -n 1p)
          grep -qi '^cache-control: public, max-age=31536000, immutable' <<<"$(curl -fsSI "$B$js")"
          # The landing page and its assets come from SITE_DIR, with botd's headers.
          [[ $(code "$B/") == 200 && $(code "$B/get-started") == 200 && $(code "$B/site/site.css") == 200 ]]
          grep -q '/site/get-started.js' <<<"$(curl -fsS "$B/get-started")"
          grep -qi "^content-security-policy: default-src 'self'" <<<"$(curl -fsSI "$B/")"
          grep -qi '^x-content-type-options: nosniff' <<<"$(curl -fsSI "$B/site/get-started.js")"
          [[ $(code "$B/site/nope.js") == 404 ]]
          # Everything else goes to botd (not running here, so 502), never to the client.
          [[ $(code "$B/console/") == 502 ]]
          [[ $(code "$B/api/signups") == 502 ]]
          [[ $(code "$B/app.js") == 502 ]]
          [[ $(code "$B/api/events") == 502 ]]
name: harness-e2e

# Approvals end to end through the real harness CLIs, at the versions SuperBot pins
# (server/src/adapters/install.rs), with a fake model (ADR 0057), and each CLI's per-Bot
# footprint, uploaded as a report (ADR 0070). The Hermes job also checks that its pin is a
# stable upstream release, that a hook timeout fails closed (ADR 0075), and that tiers
# route it to two fake providers, with fallback (ADR 0076). Runs when the code between a
# harness and a decision changes, weekly, and by hand.

on:
  pull_request:
    paths:
      - 'server/src/adapters/**'
      - 'deploy/hermes-share.sh'
      - 'deploy/hermes-pin.sh'
      - 'server/src/approvals.rs'
      - 'server/src/main.rs'
      - 'server/src/policy.rs'
      - 'server/src/policy/**'
      - 'server/src/shell.rs'
      - 'server/src/scripts.rs'
      - 'server/src/runner.rs'
      - 'server/src/tiers.rs'
      - 'server/src/sandbox.rs'
      - 'server/src/bin/botctl.rs'
      - 'server/tests/harness_e2e.rs'
      - 'server/tests/harness_footprint.rs'
      - 'server/tests/common/**'
      - 'deploy/install-harness-clis.sh'
      - 'deploy/harness-e2e.sh'
      - 'deploy/harness-footprint.sh'
      - 'Cargo.lock'
      - '.github/workflows/harness-e2e.yml'
  push:
    branches: [main]
    paths:
      - 'server/src/adapters/**'
      - 'deploy/hermes-share.sh'
      - 'deploy/hermes-pin.sh'
      - 'server/src/approvals.rs'
      - 'server/src/main.rs'
      - 'server/src/policy.rs'
      - 'server/src/policy/**'
      - 'server/src/shell.rs'
      - 'server/src/scripts.rs'
      - 'server/src/runner.rs'
      - 'server/src/tiers.rs'
      - 'server/src/sandbox.rs'
      - 'server/src/bin/botctl.rs'
      - 'server/tests/harness_e2e.rs'
      - 'server/tests/harness_footprint.rs'
      - 'server/tests/common/**'
      - 'deploy/install-harness-clis.sh'
      - 'deploy/harness-e2e.sh'
      - 'deploy/harness-footprint.sh'
      - 'Cargo.lock'
      - '.github/workflows/harness-e2e.yml'
  schedule:
    - cron: '23 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: harness-e2e-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  SUPERBOT_E2E_REQUIRE: '1'
  # The oldest Codex that runs hooks in `codex exec` the way the adapter starts it.
  # 0.132-0.140 take the flags but skip the hook; older ones refuse the flags.
  CODEX_MIN_HOOKS: '0.141.0'

jobs:
  npm-harnesses:
    name: Claude Code, Codex, Pi
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build botd and the test
        run: cargo test --test harness_e2e --no-run
      - name: Install the pinned CLIs
        run: |
          set -euo pipefail
          deploy/install-harness-clis.sh "$RUNNER_TEMP/clis" claude codex pi | tee /tmp/install.log
          grep '^/' /tmp/install.log >>"$GITHUB_PATH"
      - name: Approvals through Claude Code, Codex and Pi
        run: SUPERBOT_E2E_HARNESSES=claude,codex,pi cargo test --test harness_e2e -- --ignored --nocapture
      - name: Install the oldest Codex that runs hooks
        run: |
          set -euo pipefail
          HARNESS_VERSION_CODEX="$CODEX_MIN_HOOKS" deploy/install-harness-clis.sh "$RUNNER_TEMP/codex-min" codex | tee /tmp/codex-min.log
          grep '^/' /tmp/codex-min.log >/tmp/codex-min.path
      - name: Approvals through the oldest Codex
        run: |
          PATH="$(cat /tmp/codex-min.path):$PATH" SUPERBOT_E2E_HARNESSES=codex \
            cargo test --test harness_e2e -- --ignored --nocapture codex_hooks_hold

  hermes:
    name: Hermes Agent
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: The pin is a stable Hermes Agent release, as upstream tags it
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: deploy/hermes-pin.sh verify
      - name: Build botd and the test
        run: cargo test --test harness_e2e --no-run
      - name: Install the pinned Hermes Agent
        run: |
          set -euo pipefail
          deploy/install-harness-clis.sh "$RUNNER_TEMP/clis" hermes | tee /tmp/install.log
          grep '^/' /tmp/install.log >>"$GITHUB_PATH"
      - name: Approvals through Hermes Agent
        run: SUPERBOT_E2E_HARNESSES=hermes cargo test --test harness_e2e -- --ignored --nocapture hermes_hooks_hold
      - name: A hook that times out fails closed in Hermes Agent
        run: SUPERBOT_E2E_HARNESSES=hermes cargo test --test harness_e2e -- --ignored --nocapture hermes_hook_timeout_fails_closed
      - name: Tiers route Hermes Agent through two providers, with fallback
        run: SUPERBOT_E2E_HARNESSES=hermes cargo test --test harness_e2e -- --ignored --nocapture hermes_routes_two_providers

  # Numbers, not a gate: only ceilings far above what the pinned CLIs use are asserted.
  footprint:
    name: Footprint (Hermes Agent, Claude Code, Codex, Pi)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Measure each harness's per-Bot footprint
        run: deploy/harness-footprint.sh --install-clis "$RUNNER_TEMP/clis" --out "$RUNNER_TEMP/footprint"
      - name: Show the report
        if: always()
        run: cat "$RUNNER_TEMP/footprint/footprint.md" >>"$GITHUB_STEP_SUMMARY" || true
      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: harness-footprint
          path: ${{ runner.temp }}/footprint/
          if-no-files-found: warn

name: offline-release-check

# A published release's offline bundles, checked end to end as an air-gapped customer uses them
# (docs/adr/0172-release-bundles-checked-end-to-end.md, docs/ops/air-gapped.md). It downloads the
# bundles attached to the release and runs deploy/offline-release-check.sh: connected, each is
# signed by the offline workflow, built from the tag's commit for its arch with binaries that run
# on Ubuntu 22.04, and carries exactly the signed images ghcr.io's tags name now, read anonymously
# as a customer would. Then, in a network namespace with only loopback, against Sigstore's trusted
# root fetched beforehand as the guide says: the bundles verify, both go to a registry mirror as the
# signed multi-arch index, and cosign verifies every image and the build provenance there, keyless.
# Both arches' Hermes and harness bundles are checked the same way, at the pins of the release's
# own botd, which says machines would take them (docs/adr/0247-hermes-and-harness-bundles-in-the-release-check.md).
# Last, still with no network, it installs botd from the x86_64 bundle with Hermes Agent and the
# harness CLIs from theirs, runs each CLI, and loads the images.
# offline.yml calls it once release-bundle has attached a tag's bundles; it also runs weekly on
# the latest release (a tag that moved, or a trust root that changed, shows up there) and by hand.

on:
  workflow_call:
    inputs:
      tag:
        description: 'The release tag, e.g. v0.1.0'
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: 'A published release whose bundles are attached, e.g. v0.1.0'
        required: true
  schedule:
    - cron: '23 6 * * 1'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      TAG: ${{ inputs.tag }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: The release, its tag's commit and its bundles
        run: |
          set -euo pipefail
          if [[ -z $TAG ]]; then
            TAG=$(gh release view --json tagName -q .tagName 2>/dev/null || true)
            if [[ -z $TAG ]]; then echo "::notice::No published release yet: nothing to check"; echo "SKIP=1" >>"$GITHUB_ENV"; exit 0; fi
          fi
          [[ $TAG =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || { echo "::error::$TAG isn't a v<version> tag"; exit 1; }
          {
            echo "TAG=$TAG"
            echo "VERSION=${TAG#v}"
            echo "COMMIT=$(git rev-parse "refs/tags/$TAG^{commit}")"
          } >>"$GITHUB_ENV"
          gh release download "$TAG" --pattern 'superbot-offline-*' --pattern 'superbot-hermes-*' --pattern 'superbot-harnesses-*' \
            --dir "$RUNNER_TEMP/release"
          ls -l "$RUNNER_TEMP/release"
          df -h / | tail -n 1
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        if: env.SKIP != '1'
      - name: Packages, and Sigstore's trusted root as an operator fetches it before going offline
        if: env.SKIP != '1'
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq skopeo jq sqlite3 acl age bubblewrap socat libatomic1
          cosign initialize >/dev/null
          cp ~/.sigstore/root/tuf-repo-cdn.sigstore.dev/targets/trusted_root.json "$RUNNER_TEMP/trusted_root.json"
      # Anonymous on purpose: no registry login, so a private package fails here as it would for a customer.
      - name: Connected checks against the release and ghcr.io
        if: env.SKIP != '1'
        run: |
          set -euo pipefail
          deploy/offline-release-check.sh online "$RUNNER_TEMP/release" --version "$VERSION" --commit "$COMMIT" --max-glibc 2.35 \
            --image "superbot=ghcr.io/${GITHUB_REPOSITORY,,}:$VERSION" \
            --image "caddy=ghcr.io/${GITHUB_REPOSITORY,,}-caddy:$VERSION" \
            --image-identity "https://github.com/$GITHUB_REPOSITORY/.github/workflows/docker.yml@refs/tags/v$VERSION" \
            | tee -a "$RUNNER_TEMP/check.log"
      - name: A network namespace with only loopback, and a registry binary for the mirror
        if: env.SKIP != '1'
        run: |
          set -euo pipefail
          sudo ip netns add offline
          sudo ip -n offline link set lo up
          sudo mkdir -p /etc/systemd/system/superbot.service.d /etc/containers/registries.conf.d
          printf '[Service]\nNetworkNamespacePath=/run/netns/offline\n' \
            | sudo tee /etc/systemd/system/superbot.service.d/zz-offline-ci.conf >/dev/null
          sudo systemctl daemon-reload
          id=$(docker create registry:2)
          docker cp "$id:/bin/registry" "$RUNNER_TEMP/registry"
          docker rm "$id" >/dev/null
          printf 'version: 0.1\nlog: {level: error}\nstorage: {filesystem: {rootdirectory: %s}}\nhttp: {addr: 127.0.0.1:5002}\n' \
            "$RUNNER_TEMP/mirror" >"$RUNNER_TEMP/registry.yml"
          printf '[[registry]]\nlocation = "localhost:5002"\ninsecure = true\n' \
            | sudo tee /etc/containers/registries.conf.d/51-offline-mirror.conf >/dev/null
      - name: With no network, the bundles verify and go to a mirror, where cosign verifies the images keyless
        if: env.SKIP != '1'
        run: |
          set -euo pipefail
          sudo ip netns exec offline env PATH="$(dirname "$(command -v cosign)"):$PATH" bash -c '
            set -euo pipefail
            registry=$1 config=$2 release=$3 root=$4
            if curl -sS --max-time 5 https://github.com >/dev/null 2>&1; then echo "the network is still up" >&2; exit 1; fi
            "$registry" serve "$config" >/tmp/offline-mirror-registry.log 2>&1 &
            trap "kill $!" EXIT
            for _ in $(seq 1 30); do curl -fsS http://localhost:5002/v2/ >/dev/null 2>&1 && break; sleep 1; done
            deploy/offline-release-check.sh offline "$release" --mirror localhost:5002/superbot --trusted-root "$root"
          ' _ "$RUNNER_TEMP/registry" "$RUNNER_TEMP/registry.yml" "$RUNNER_TEMP/release" "$RUNNER_TEMP/trusted_root.json" \
            | tee -a "$RUNNER_TEMP/check.log"
      - name: With no network, install botd, Hermes Agent and the harness CLIs from the x86_64 bundles, and load the images
        if: env.SKIP != '1'
        run: |
          set -euo pipefail
          r="$RUNNER_TEMP/release" exp="$RUNNER_TEMP/release/release-check.expected"
          b="$r/superbot-offline-$VERSION-x86_64.tar.gz"
          sum=$(awk '$1 == "bundle" && $2 == "x86_64" { print $3 }' "$exp")
          read -r hb hsum < <(awk '$1 == "hermes" && $2 == "x86_64" { print $3, $4 }' "$exp")
          read -r nb nsum < <(awk '$1 == "harnesses" && $2 == "x86_64" { print $3, $4 }' "$exp")
          mkdir -p "$RUNNER_TEMP/installer"
          tar -xzf "$b" -C "$RUNNER_TEMP/installer" --strip-components=1 "superbot-offline-$VERSION-x86_64/deploy"
          sudo ip netns exec offline env PATH="$(dirname "$(command -v cosign)"):$PATH" SIGSTORE_TRUSTED_ROOT="$RUNNER_TEMP/trusted_root.json" \
            bash "$RUNNER_TEMP/installer/deploy/install.sh" --offline "$b" --bundle-sha256 "$sum" --testing-mode --non-interactive --tz UTC \
              --with-hermes --hermes-bundle "$r/$hb" --hermes-bundle-sha256 "$hsum" --harness-bundle "$r/$nb" --harness-bundle-sha256 "$nsum" \
            | tee /tmp/offline-install.log
          grep -Fq 'Bundle signature verified' /tmp/offline-install.log
          grep -Fq "Offline bundle $VERSION (x86_64" /tmp/offline-install.log
          grep -Eq 'Installing Hermes Agent [0-9a-f]{12} system-wide in /opt/hermes from the Hermes bundle' /tmp/offline-install.log
          grep -Fq 'Installing claude codex pi system-wide in /opt/superbot-harnesses from the harness bundle' /tmp/offline-install.log
          grep -Fq 'SuperBot is installed.' /tmp/offline-install.log
          probe=$(mktemp -d) && chmod 0777 "$probe"
          sudo ip netns exec offline sudo -u nobody env HOME="$probe" HERMES_HOME="$probe/h" /usr/local/bin/hermes --version | tee /tmp/offline-hermes-version.log
          grep -q '^Hermes Agent v' /tmp/offline-hermes-version.log
          for c in claude codex pi; do
            want=$(sed -n "s/^harness_$c=\([^ ]*\) .*/\1/p" /opt/superbot-harnesses/superbot/MANIFEST)
            out=$(sudo ip netns exec offline sudo -u nobody env -i HOME="$probe" PATH=/usr/bin:/bin "/usr/local/bin/$c" --version)
            echo "$c: $out"
            [[ -n $want && $out == *"$want"* ]]
          done
          sudo rm -rf "$probe"
          [[ $(sudo readlink "/proc/$(systemctl show -p MainPID --value superbot)/ns/net") == "$(sudo ip netns exec offline readlink /proc/self/ns/net)" ]]
          for _ in $(seq 1 30); do sudo ip netns exec offline curl -fsS http://127.0.0.1:3000/healthz >/dev/null 2>&1 && break; sleep 1; done
          sudo ip netns exec offline curl -fsS http://127.0.0.1:3000/healthz
          grep -qx "version=$VERSION" /usr/local/share/superbot/offline-release
          sudo unshare --net -- env PATH="$(dirname "$(command -v cosign)"):$PATH" SIGSTORE_TRUSTED_ROOT="$RUNNER_TEMP/trusted_root.json" \
            deploy/offline-bundle.sh load "$b" --sha256 "$sum" | tee /tmp/offline-load.log
          grep -Fq 'Bundle signature verified' /tmp/offline-load.log
          for image in "ghcr.io/${GITHUB_REPOSITORY,,}:$VERSION" "ghcr.io/${GITHUB_REPOSITORY,,}-caddy:$VERSION"; do
            [[ $(docker image inspect --format '{{.Architecture}}' "$image") == amd64 ]]
          done
      - name: Summary
        if: env.SKIP != '1'
        run: |
          {
            echo "### Offline bundles for $TAG checked end to end"
            echo
            echo '```'
            grep '^==>' "$RUNNER_TEMP/check.log"
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"
      - name: Logs on failure
        if: failure()
        run: |
          sudo journalctl -u superbot --no-pager | tail -n 80 || true
          cat /tmp/offline-*.log 2>/dev/null || true

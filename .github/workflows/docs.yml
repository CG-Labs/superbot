name: docs

# Links in the security pack (docs/security/, its policies/ included) point at ADRs, other
# docs, workflows and config, so a change to any of them can break one. The same test checks
# each policy's owner, review cadence and checklist items, and the Type II evidence plan's
# rows (ADR 0130). Changes to server/, deploy/ and
# apps/client/ run the same test in the server workflow's `cargo test`. Any change under
# .github/ also checks that actions stay pinned by commit (ADR 0100) and that the docker
# workflow still scans, signs and attests its images (ADR 0101), and that the release
# workflow checks CHANGELOG.md and publishes only from checked tags (ADR 0111), and that every
# tag gets signed offline bundles once its images are published (ADR 0140), and that the
# change-evidence workflow only reads and its bundle still matches the evidence plan
# (ADR 0148), that the drill bundle reads the drill scripts' records (ADR 0177), and that the
# register bundle checks against the real policy files (ADR 0204). The site job
# builds the public site and docs portal from docs/ and fails on any broken internal link
# (ADR 0119); the site is kept as an artifact, never published from here.
on:
  push:
    paths:
      - 'docs/**'
      - 'server/tests/security_docs_links.rs'
      - 'server/tests/support_docs.rs'
      - 'server/tests/actions_pinned.rs'
      - 'server/tests/image_supply_chain.rs'
      - 'server/tests/release_workflow.rs'
      - 'server/tests/offline_release.rs'
      - 'server/tests/change_evidence.rs'
      - 'server/tests/evidence_coverage.rs'
      - 'server/tests/drill_evidence.rs'
      - 'server/tests/register_evidence.rs'
      - 'server/tests/uptime_evidence.rs'
      - 'server/tests/alert_evidence.rs'
      - 'deploy/backup-drill.sh'
      - 'deploy/machine-restore-drill.sh'
      - 'server/tests/fixtures/github/**'
      - 'server/src/bin/superbot-evidence/**'
      - 'CHANGELOG.md'
      - 'SECURITY.md'
      - '.github/**'
      - '.grype.yaml'
      - 'deploy/README.md'
      - 'deploy/prometheus/**'
      - '.cargo/**'
      - 'site/**'
      - 'server/src/bin/superbot-site/**'
      - 'deploy/tiers.example.json'
  pull_request:
    paths:
      - 'docs/**'
      - 'server/tests/security_docs_links.rs'
      - 'server/tests/support_docs.rs'
      - 'server/tests/actions_pinned.rs'
      - 'server/tests/image_supply_chain.rs'
      - 'server/tests/release_workflow.rs'
      - 'server/tests/offline_release.rs'
      - 'server/tests/change_evidence.rs'
      - 'server/tests/evidence_coverage.rs'
      - 'server/tests/drill_evidence.rs'
      - 'server/tests/register_evidence.rs'
      - 'server/tests/uptime_evidence.rs'
      - 'server/tests/alert_evidence.rs'
      - 'deploy/backup-drill.sh'
      - 'deploy/machine-restore-drill.sh'
      - 'server/tests/fixtures/github/**'
      - 'server/src/bin/superbot-evidence/**'
      - 'CHANGELOG.md'
      - 'SECURITY.md'
      - '.github/**'
      - '.grype.yaml'
      - 'deploy/README.md'
      - 'deploy/prometheus/**'
      - '.cargo/**'
      - 'site/**'
      - 'server/src/bin/superbot-site/**'
      - 'deploy/tiers.example.json'

permissions:
  contents: read

jobs:
  security-pack-links:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo test --test security_docs_links
      # ADR 0100: every remote action is pinned to a full commit SHA.
      - run: cargo test --test actions_pinned
      # ADR 0101: images are scanned, signed and attested, with minimal permissions.
      - run: cargo test --test image_supply_chain
      # ADR 0111: CHANGELOG.md is checked and each tag becomes a release, with minimal permissions.
      - run: cargo test --test release_workflow
      # ADR 0140: every tag gets offline bundles, from its own commit on main, signed, after its images.
      - run: cargo test --test offline_release
      # The support playbooks (docs/support/, #60): links, plans against the SLO, placeholders.
      - run: cargo test --test support_docs
      # ADR 0148: the change-management bundle matches the evidence plan, and its workflow only reads.
      - run: cargo test --locked --bin superbot-evidence
      - run: cargo test --test change_evidence
      # ADR 0169: the coverage report over the real botd's evidence bundles.
      - run: cargo test --test evidence_coverage
      # ADR 0177: the drill bundle from a stand-in GitHub and the real drill scripts' records.
      - run: cargo test --test drill_evidence
      # ADR 0204: the register bundle from a register, the real policy files and baseline checks.
      - run: cargo test --test register_evidence
      # ADR 0249: the uptime bundle from a stand-in Prometheus and from a checks file.
      - run: cargo test --test uptime_evidence
      # ADR 0288: the alerts bundle from a stand-in Prometheus's query and rules API.
      - run: cargo test --test alert_evidence

  site:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
      - run: cargo test --locked --bin superbot-site
      - run: node --test server/src/bin/superbot-site/assets/search.test.js
      # Fails on any broken internal link in docs/ or in the built pages. Built outside
      # target/, which the Rust cache restores.
      - run: cargo run --locked --bin superbot-site -- --out "$RUNNER_TEMP/superbot-site"
      - name: Keep the built site
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: superbot-site
          path: ${{ runner.temp }}/superbot-site
          # Keeps the .superbot-site marker, so a downloaded copy can be rebuilt in place.
          include-hidden-files: true
          retention-days: 14

name: client

on:
  push:
    paths:
      - "apps/client/**"
      - "web/index.html"
      - "web/styles.css"
      - ".github/workflows/client.yml"
  pull_request:
    paths:
      - "apps/client/**"
      - "web/index.html"
      - "web/styles.css"
      - ".github/workflows/client.yml"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/client
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/client/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run brand:test
      - run: npm run brand:check
      - run: npm run tokens:test
      - run: npm run tokens:check
      - run: npm run build:web
name: docker

on:
  push:
    paths:
      - 'Dockerfile'
      - '.dockerignore'
      - 'deploy/docker/**'
      - 'server/**'
      - 'web/**'
      - 'apps/client/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/docker.yml'
  pull_request:
    paths:
      - 'Dockerfile'
      - '.dockerignore'
      - 'deploy/docker/**'
      - 'server/**'
      - 'web/**'
      - 'apps/client/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/docker.yml'

permissions:
  contents: read

jobs:
  compose-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: superbot:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build Caddy image with the web client
        uses: docker/build-push-action@v6
        with:
          context: .
          target: caddy
          load: true
          tags: superbot-caddy:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Compose file is valid
        working-directory: deploy/docker
        run: |
          cp .env.example .env
          sed -i "s/^AUTH_PASSWORD=.*/AUTH_PASSWORD=ci-only/" .env
          sed -i "s/^SUPERBOT_MASTER_KEY=.*/SUPERBOT_MASTER_KEY=$(openssl rand -hex 32)/" .env
          docker compose config --quiet
          rm .env
      - name: Smoke test (compose up, healthz, auth, web client at /app/, backup/restore, compose down)
        env:
          SUPERBOT_IMAGE: superbot:ci
          SUPERBOT_CADDY_IMAGE: superbot-caddy:ci
          SMOKE_NO_BUILD: '1'
        run: deploy/docker/smoke-test.sh

name: docker

# Builds the botd and Caddy images for amd64 and arm64 on native runners and smoke-tests each.
# Pushes to main and version tags then publish them to GHCR with the repository's own token
# (docs/adr/0084-published-image-with-computer-use.md):
#   ghcr.io/<owner>/superbot        main, sha-<short>, <version>, <major>.<minor>, latest
#   ghcr.io/<owner>/superbot-caddy  the same tags
# A weekly run rebuilds main without the cache, and so does each version tag, so Debian's security
# fixes (Chromium's above all) reach the images. Pull requests build and test only.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    paths:
      - 'Dockerfile'
      - '.dockerignore'
      - 'deploy/docker/**'
      - 'deploy/superbot-backup.sh'
      - 'deploy/superbot-restore.sh'
      - 'deploy/superbot-userctl.sh'
      - 'deploy/install.sh'
      - 'deploy/hermes-share.sh'
      - 'server/**'
      - 'web/**'
      - 'site/**'
      - 'apps/client/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/docker.yml'
  schedule:
    - cron: '23 4 * * 1'

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: compose-smoke (${{ matrix.arch }})
    env:
      FRESH: ${{ github.event_name == 'schedule' || startsWith(github.ref, 'refs/tags/') }}
      PUBLISH: ${{ github.event_name != 'pull_request' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Image names
        run: |
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >>"$GITHUB_ENV"
          echo "CADDY_IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}-caddy" >>"$GITHUB_ENV"
          {
            echo 'LABELS<<EOF'
            echo "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
            echo "org.opencontainers.image.revision=$GITHUB_SHA"
            echo EOF
          } >>"$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: superbot:ci
          pull: ${{ env.FRESH == 'true' }}
          no-cache: ${{ env.FRESH == 'true' }}
          labels: ${{ env.LABELS }}
          cache-from: type=gha,scope=superbot-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=superbot-${{ matrix.arch }}
      - name: Build Caddy image with the web client
        uses: docker/build-push-action@v6
        with:
          context: .
          target: caddy
          load: true
          tags: superbot-caddy:ci
          pull: ${{ env.FRESH == 'true' }}
          no-cache: ${{ env.FRESH == 'true' }}
          labels: ${{ env.LABELS }}
          cache-from: type=gha,scope=caddy-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=caddy-${{ matrix.arch }}
      - name: Compose files are valid
        working-directory: deploy/docker
        run: |
          cp .env.example .env
          sed -i "s/^AUTH_PASSWORD=.*/AUTH_PASSWORD=ci-only/" .env
          sed -i "s/^SUPERBOT_MASTER_KEY=.*/SUPERBOT_MASTER_KEY=$(openssl rand -hex 32)/" .env
          docker compose config --quiet
          docker compose -f docker-compose.yml -f docker-compose.build.yml config --quiet
          rm .env
      - name: Smoke test (compose up, healthz, auth, web client, screens and browser, backup/restore, compose down)
        env:
          SUPERBOT_IMAGE: superbot:ci
          SUPERBOT_CADDY_IMAGE: superbot-caddy:ci
          SMOKE_NO_BUILD: '1'
        run: deploy/docker/smoke-test.sh

      # Publishing: the same builds again (all cached), pushed by digest; `publish` tags them.
      - name: Log in to GHCR
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push image by digest
        id: push
        if: env.PUBLISH == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          labels: ${{ env.LABELS }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=superbot-${{ matrix.arch }}
      - name: Push Caddy image by digest
        id: push-caddy
        if: env.PUBLISH == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          target: caddy
          platforms: linux/${{ matrix.arch }}
          labels: ${{ env.LABELS }}
          outputs: type=image,name=${{ env.CADDY_IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=caddy-${{ matrix.arch }}
      - name: Save digests
        if: env.PUBLISH == 'true'
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
          CADDY_DIGEST: ${{ steps.push-caddy.outputs.digest }}
        run: |
          mkdir -p digests/superbot digests/caddy
          touch "digests/superbot/${DIGEST#sha256:}" "digests/caddy/${CADDY_DIGEST#sha256:}"
      - name: Upload digests
        if: env.PUBLISH == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.arch }}
          path: digests/
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - name: Image names
        run: |
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >>"$GITHUB_ENV"
          echo "CADDY_IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}-caddy" >>"$GITHUB_ENV"
      - uses: actions/download-artifact@v4
        with:
          pattern: digests-*
          path: digests
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - name: Tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=sha-,format=short,enable=${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}},enable=${{ !startsWith(github.ref, 'refs/tags/v0.') }}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-') }}
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tag the multi-arch images
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          mapfile -t tags < <(sed -n 's/^.*://p' <<<"$TAGS")
          ((${#tags[@]})) || { echo "No tags for $GITHUB_REF" >&2; exit 1; }
          for pair in "superbot=$IMAGE" "caddy=$CADDY_IMAGE"; do
            dir=${pair%%=*} image=${pair#*=}
            args=() sources=()
            for t in "${tags[@]}"; do args+=(-t "$image:$t"); done
            for d in "digests/$dir"/*; do sources+=("$image@sha256:${d##*/}"); done
            ((${#sources[@]} == 2)) || { echo "Expected 2 $dir digests (amd64, arm64), got ${#sources[@]}" >&2; exit 1; }
            docker buildx imagetools create "${args[@]}" "${sources[@]}"
            docker buildx imagetools inspect "$image:${tags[0]}"
          done

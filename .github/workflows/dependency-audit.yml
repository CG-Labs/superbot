name: dependency-audit

# Known vulnerabilities in the locked dependencies (ADR 0092). Runs when a lockfile or
# this config changes, and weekly, since new advisories arrive without any change here.
on:
  push:
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.cargo/audit.toml'
      - 'apps/client/package.json'
      - 'apps/client/package-lock.json'
      - '.github/workflows/dependency-audit.yml'
  pull_request:
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.cargo/audit.toml'
      - 'apps/client/package.json'
      - 'apps/client/package-lock.json'
      - '.github/workflows/dependency-audit.yml'
  schedule:
    - cron: '41 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cargo-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: cargo-audit
      # Fails on any RustSec vulnerability not ignored, with its reason, in .cargo/audit.toml.
      # Unmaintained-crate warnings are reported, not fatal.
      - run: cargo audit

  npm-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/client
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
      # Dev dependencies too: Electron is one, and the desktop app ships inside it.
      - name: Report every advisory
        run: npm audit --package-lock-only || true
      # High and above fail (ADR 0092, ADR 0115). npm has no per-advisory ignore list, so a High
      # with no fix is replaced or overridden; an accepted one is listed, with its reason, in the
      # SOC 2 readiness checklist (CC7.1-2).
      - name: Fail on high and critical advisories
        run: npm audit --package-lock-only --audit-level=high
